<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Rooms | Gen'Z India ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .create-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }
        .room-card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }
        .room-card h3 {
            color: #f8fafc;
            font-size: 16px;
        }
        .room-card p {
            color: #94a3b8;
            font-size: 12px;
        }
        .join-btn {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #1f2937;
        }
        .modal-content h3 {
            color: #10b981;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .modal-content input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
            <h2 style="color: #f59e0b; font-size: 18px;">Active Study Rooms 👥</h2>
            <button class="create-btn" onclick="openCreateModal()">+ Create Room</button>
        </div>

        <div class="rooms-grid" id="roomsGrid">
            <p style="color: #94a3b8; font-size: 13px;">Loading rooms from cloud...</p>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>Create Study Room</h3>
            <input type="text" id="roomNameInput" placeholder="Enter Room Name...">
            <div class="btn-group">
                <button class="create-btn" style="flex:1;" onclick="createRoom()">Create</button>
                <button class="create-btn" style="flex:1; background:#334155;" onclick="closeCreateModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUWeIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const currentUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // Load rooms in real-time from Firestore
        db.collection("studyRooms").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const grid = document.getElementById('roomsGrid');
            if (snapshot.empty) {
                grid.innerHTML = `<p style="color: #94a3b8; font-size: 13px;">No active study rooms. Create one!</p>`;
                return;
            }

            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const room = doc.data();
                grid.innerHTML += `
                    <div class="room-card">
                        <div>
                            <h3>${room.name}</h3>
                            <p>Admin / Creator: <b>${room.admin}</b></p>
                        </div>
                        <button class="join-btn" onclick='joinRoom(${JSON.stringify(room)})'>Join Room 🚀</button>
                    </div>
                `;
            });
        });

        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        function createRoom() {
            const name = document.getElementById('roomNameInput').value.trim();
            if (!name) {
                alert("Please enter a room name.");
                return;
            }

            const roomId = 'room_' + Date.now();
            const roomData = {
                id: roomId,
                name: name,
                admin: currentUser.name,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("studyRooms").doc(roomId).set(roomData).then(() => {
                closeCreateModal();
                localStorage.setItem('activeStudyRoom', JSON.stringify(roomData));
                window.location.href = 'room_chat.html';
            }).catch(err => {
                alert("Error creating room: " + err.message);
            });
        }

        function joinRoom(room) {
            localStorage.setItem('activeStudyRoom', JSON.stringify(room));
            window.location.href = 'room_chat.html';
        }
    </script>
</body>
</html>
