<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen'Z | Study Room Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            flex-wrap: wrap;
            gap: 8px;
        }
        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-chip {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }
        @media(min-width: 768px) {
            .workspace {
                flex-direction: row;
            }
        }
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
            border-bottom: 1px solid #1f2937;
            padding: 10px;
            max-height: 50vh;
        }
        @media(min-width: 768px) {
            .chat-section {
                border-bottom: none;
                border-right: 1px solid #1f2937;
                padding: 15px;
                max-height: none;
            }
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
            margin-bottom: 10px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }
        .user-msg {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            font-weight: 500;
        }
        .peer-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        .system-req-msg {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #f59e0b;
            align-self: center;
            text-align: center;
            width: 100%;
            font-weight: 600;
        }
        .message img {
            max-width: 180px;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
        }
        .chat-input-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input-box input[type="text"] {
            flex: 1;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 12px;
        }
        .file-upload-label {
            background: #334155;
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .send-btn {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        .video-section {
            width: 100%;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            flex: 1;
        }
        @media(min-width: 768px) {
            .video-section {
                width: 320px;
                flex: none;
                padding: 15px;
                gap: 15px;
            }
        }
        .video-box {
            flex: 1;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #1f2937;
            min-height: 140px;
            overflow: hidden;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        .video-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .v-btn {
            flex: 1;
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .v-btn.active {
            background: #10b981;
        }
        .request-access-btn {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            border: 1px solid #1f2937;
        }
        .modal-content h3 {
            color: #f59e0b;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .modal-content input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .search-results {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .user-result-item {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .invite-action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 10px;
        }
        .joined-tag {
            background: #10b981;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 10px;
        }
        .btn-cancel {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <a href="study_rooms.html" class="back-btn">← Leave Room</a>
        <h3 id="roomTitleHeader" style="font-size: 13px; color: #f59e0b;">Study Room</h3>
        <div class="header-actions">
            <button class="action-chip" onclick="openInviteModal()">+ Add</button>
            <span id="roleIndicator" style="font-size: 11px; color: #f59e0b;">● Checking...</span>
        </div>
    </header>

    <div class="workspace">
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div class="message peer-msg"><b>System:</b> Welcome to the room session! Respect privacy and study together.</div>
            </div>

            <form class="chat-input-box" id="chatForm">
                <label class="file-upload-label" title="Share Notes Image">
                    📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </label>
                <input type="text" id="messageInput" placeholder="Type a message or doubt..." autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </div>

        <div class="video-section">
            <h4 style="font-size: 13px; color: #38bdf8;" id="videoHeaderTitle">Study Video Session</h4>
            <div class="video-box">
                <video id="localVideo" autoplay playsinline></video>
                <div class="video-label" id="videoLabel">You (Camera Off)</div>
            </div>
            
            <div class="video-controls">
                <button class="request-access-btn" id="requestAccessBtn" onclick="requestMicCamAccess()">Request Mic/Cam Access 🎙️</button>
                <div class="control-row" id="mediaControlRow" style="display: none;">
                    <button class="v-btn" id="camToggleBtn" onclick="toggleCamera()">Cam Off</button>
                    <button class="v-btn" id="micToggleBtn" onclick="toggleMic()">Mic Off</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <h3>Search & Invite Members</h3>
            <input type="text" id="searchUserInput" placeholder="Search by name..." oninput="searchUsers(this.value)">
            <div class="search-results" id="searchResults">
                <p style="font-size: 11px; color: #94a3b8; text-align: center;">Type to search registered peers...</p>
            </div>
            <button class="btn-cancel" onclick="closeInviteModal()">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUWeIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const activeRoom = JSON.parse(localStorage.getItem('activeStudyRoom'));
        const activeUser = JSON.parse(localStorage.getItem('genzUser'));

        if (!activeRoom || !activeUser) {
            window.location.href = 'study_rooms.html';
        }

        document.getElementById('roomTitleHeader').innerText = `Room: ${activeRoom.name}`;

        const roomAdmin = (activeRoom.admin || "").trim().toLowerCase();
        const currentName = (activeUser.name || "").trim().toLowerCase();
        const currentUsername = (activeUser.username || "").trim().toLowerCase();

        let isAdmin = (roomAdmin === currentName || (currentUsername && roomAdmin === currentUsername));
        
        let localStream = null;

        const roleIndicator = document.getElementById('roleIndicator');
        const requestAccessBtn = document.getElementById('requestAccessBtn');
        const mediaControlRow = document.getElementById('mediaControlRow');
        const videoLabel = document.getElementById('videoLabel');

        if (isAdmin) {
            roleIndicator.innerText = "● Admin (Full Control)";
            roleIndicator.style.color = "#f59e0b";
            requestAccessBtn.style.display = 'none';
            mediaControlRow.style.display = 'flex';
            videoLabel.innerText = "You (Admin - Cam Off)";
        } else {
            roleIndicator.innerText = "● Member";
            roleIndicator.style.color = "#38bdf8";
            requestAccessBtn.style.display = 'block';
            mediaControlRow.style.display = 'none';
            videoLabel.innerText = "You (Member)";
        }

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');

        // Real-time messages sync including Admin/Member requests in chat
        db.collection("studyRooms").doc(activeRoom.id || activeRoom.name).collection("messages").orderBy("createdAt", "asc")
        .onSnapshot((snapshot) => {
            chatMessages.innerHTML = `<div class="message peer-msg"><b>System:</b> Welcome to the room session! Respect privacy and study together.</div>`;
            snapshot.forEach((doc) => {
                const msg = doc.data();
                if (msg.type === 'request') {
                    chatMessages.innerHTML += `<div class="message system-req-msg">🔔 <b>${msg.sender}</b> has requested Mic/Cam Access!</div>`;
                } else {
                    appendMessage(msg.text, msg.image, msg.sender === activeUser.name ? 'user-msg' : 'peer-msg', msg.sender);
                }
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];
            if (!text && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    saveMessageToFirestore(text, event.target.result, 'chat');
                };
                reader.readAsDataURL(file);
            } else {
                saveMessageToFirestore(text, null, 'chat');
            }
            messageInput.value = '';
            imageInput.value = '';
        });

        function saveMessageToFirestore(text, imgSrc, type) {
            db.collection("studyRooms").doc(activeRoom.id || activeRoom.name).collection("messages").add({
                sender: activeUser.name,
                text: text || "",
                image: imgSrc || "",
                type: type || 'chat',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function appendMessage(text, imgSrc, className, sender) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            let content = `<b>${sender}:</b> ${text}`;
            if (imgSrc) {
                content += `<img src="${imgSrc}" alt="Shared Note">`;
            }
            div.innerHTML = content;
            chatMessages.appendChild(div);
        }

        function openInviteModal() {
            document.getElementById('inviteModal').style.display = 'flex';
        }

        function closeInviteModal() {
            document.getElementById('inviteModal').style.display = 'none';
        }

        function searchUsers(query) {
            const resultsDiv = document.getElementById('searchResults');
            if (!query.trim()) {
                resultsDiv.innerHTML = `<p style="font-size: 11px; color: #94a3b8; text-align: center;">Type to search registered peers...</p>`;
                return;
            }

            db.collection("users").get().then((snapshot) => {
                let usersList = [];
                snapshot.forEach(doc => {
                    usersList.push(doc.data());
                });

                const q = query.trim().toLowerCase();
                const filtered = usersList.filter(u => 
                    u.name && u.name.toLowerCase().includes(q)
                );

                if (filtered.length === 0) {
                    resultsDiv.innerHTML = `<p style="font-size: 11px; color: #ef4444; text-align: center;">No registered user found.</p>`;
                    return;
                }

                resultsDiv.innerHTML = '';
                filtered.forEach(u => {
                    // Check if user is already admin or current user
                    let isSelfOrAdmin = (u.name.toLowerCase() === activeUser.name.toLowerCase() || u.name.toLowerCase() === roomAdmin);
                    
                    resultsDiv.innerHTML += `
                        <div class="user-result-item">
                            <span><b>${u.name}</b> (@${u.username || 'user'})</span>
                            ${isSelfOrAdmin ? '<span class="joined-tag" style="background:#334155;">Admin</span>' : `<button class="invite-action-btn" id="btn_${u.name.replace(/\s+/g,'')}" onclick="sendInvite('${u.name}')">Send Invite 🚀</button>`}
                        </div>
                    `;
                });
            });
        }

        function sendInvite(username) {
            db.collection("notifications").add({
                targetUser: username,
                title: "Study Room Invitation 👥",
                message: `${activeUser.name} invited you to join study room: ${activeRoom.name}`,
                time: new Date().toLocaleTimeString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                broadcast: false
            }).then(() => {
                const btn = document.getElementById(`btn_${username.replace(/\s+/g,'')}`);
                if(btn) {
                    btn.outerHTML = `<span class="joined-tag">Joined</span>`;
                }
                alert(`Invite successfully sent to ${username}!`);
            });
        }

        function requestMicCamAccess() {
            // Save request as a message in room chat so Admin sees it instantly
            saveMessageToFirestore("Requested Mic/Cam Access", null, 'request');

            // Also send notification to Admin
            db.collection("notifications").add({
                targetUser: activeRoom.admin,
                title: "Mic/Cam Access Request 🎙️",
                message: `${activeUser.name} is requesting mic/cam access in room: ${activeRoom.name}`,
                time: new Date().toLocaleTimeString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                broadcast: false
            }).then(() => {
                alert(`Access request sent to room admin (${activeRoom.admin})!`);
                requestAccessBtn.innerText = "Request Sent (Waiting)...";
                requestAccessBtn.disabled = true;
            });
        }

        async function toggleCamera() {
            const camBtn = document.getElementById('camToggleBtn');
            const videoLabel = document.getElementById('videoLabel');
            const videoElem = document.getElementById('localVideo');

            if (localStream && localStream.getVideoTracks().some(track => track.readyState === 'live')) {
                localStream.getVideoTracks().forEach(track => track.stop());
                videoElem.srcObject = null;
                camBtn.classList.remove('active');
                camBtn.innerText = "Cam Off";
                videoLabel.innerText = "You (Camera Off)";
            } else {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    videoElem.srcObject = localStream;
                    camBtn.classList.add('active');
                    camBtn.innerText = "Cam On";
                    document.getElementById('micToggleBtn').classList.add('active');
                    document.getElementById('micToggleBtn').innerText = "Mic On";
                    videoLabel.innerText = isAdmin ? "You (Admin Live 🔴)" : "You (Member Active)";
                } catch (err) {
                    alert("Camera access denied or unavailable.");
                }
            }
        }

        function toggleMic() {
            if (!localStream) {
                alert("Please turn on your camera/mic session first by clicking 'Cam Off'.");
                return;
            }
            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length > 0) {
                audioTracks[0].enabled = !audioTracks[0].enabled;
                const micBtn = document.getElementById('micToggleBtn');
                if (audioTracks[0].enabled) {
                    micBtn.classList.add('active');
                    micBtn.innerText = "Mic On";
                } else {
                    micBtn.classList.remove('active');
                    micBtn.innerText = "Mic Off";
                }
            }
        }
    </script>
</body>
</html>
