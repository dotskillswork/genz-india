<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen'Z | Study Room Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }
        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .add-member-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .add-member-btn:hover {
            background: #059669;
        }
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        /* Chat Panel */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0f19;
            border-right: 1px solid #1f2937;
            padding: 15px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            margin-bottom: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }
        .user-msg {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            font-weight: 500;
        }
        .peer-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        .message img {
            max-width: 200px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }
        .chat-input-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-box input[type="text"] {
            flex: 1;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
        }
        .file-upload-label {
            background: #334155;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .send-btn {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        /* Video Call Panel */
        .video-section {
            width: 320px;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }
        .video-box {
            flex: 1;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #1f2937;
            overflow: hidden;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .video-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .v-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .v-btn.active {
            background: #10b981;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #1f2937;
        }
        .modal-content h3 {
            color: #f59e0b;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .modal-content input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .search-results {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-result-item {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .invite-action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-cancel {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <a href="study_rooms.html" class="back-btn">← Leave Room</a>
        <h3 id="roomTitleHeader" style="font-size: 15px; color: #f59e0b;">Study Room</h3>
        <div class="header-actions">
            <button class="add-member-btn" onclick="openInviteModal()">+ Add Member</button>
            <span style="font-size: 12px; color: #10b981;">● Secure</span>
        </div>
    </header>

    <div class="workspace">
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div class="message peer-msg"><b>System:</b> Welcome! Click '+ Add Member' to search and invite peers by username.</div>
            </div>

            <form class="chat-input-box" id="chatForm">
                <label class="file-upload-label" title="Share Notes Image">
                    📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </label>
                <input type="text" id="messageInput" placeholder="Type a message or doubt..." autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </div>

        <div class="video-section">
            <h4 style="font-size: 14px; color: #38bdf8;">Study Video Session</h4>
            <div class="video-box">
                <video id="localVideo" autoplay muted></video>
                <div class="video-label">You (Hidden Number)</div>
            </div>
            <div class="video-controls">
                <button class="v-btn active" id="camToggleBtn" onclick="toggleCamera()">Cam On</button>
                <button class="v-btn active" id="micToggleBtn" onclick="toggleMic()">Mic On</button>
            </div>
        </div>
    </div>

    <!-- Add Member / Search Modal -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <h3>Search & Invite Members</h3>
            <input type="text" id="searchUserInput" placeholder="Search by username..." oninput="searchUsers(this.value)">
            <div class="search-results" id="searchResults">
                <p style="font-size: 12px; color: #94a3b8; text-align: center;">Type username to search peers...</p>
            </div>
            <button class="btn-cancel" onclick="closeInviteModal()">Close</button>
        </div>
    </div>

    <script>
        const activeRoom = JSON.parse(localStorage.getItem('activeStudyRoom'));
        const activeUser = JSON.parse(localStorage.getItem('genzUser'));

        if (!activeRoom || !activeUser) {
            window.location.href = 'study_rooms.html';
        }

        document.getElementById('roomTitleHeader',).innerText = `Room: ${activeRoom.name}`;

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];
            if (!text && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    appendMessage(text, event.target.result, 'user-msg', activeUser.name);
                };
                reader.readAsDataURL(file);
            } else {
                appendMessage(text, null, 'user-msg', activeUser.name);
            }
            messageInput.value = '';
            imageInput.value = '';
        });

        function appendMessage(text, imgSrc, className, sender) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            let content = `<b>${sender}:</b> ${text}`;
            if (imgSrc) {
                content += `<img src="${imgSrc}" alt="Shared Note">`;
            }
            div.innerHTML = content;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Modal Controls for Search & Add Member
        function openInviteModal() {
            document.getElementById('inviteModal').style.display = 'flex';
        }

        function closeInviteModal() {
            document.getElementById('inviteModal').style.display = 'none';
        }

        function searchUsers(query) {
            const resultsDiv = document.getElementById('searchResults');
            if (!query.trim()) {
                resultsDiv.innerHTML = `<p style="font-size: 12px; color: #94a3b8; text-align: center;">Type username to search peers...</p>`;
                return;
            }

            // Simulated user pool for searching
            const mockUsers = [
                { username: 'Rahul_MSc', name: 'Rahul Sharma' },
                { username: 'Priya_Dev', name: 'Priya Verma' },
                { username: 'Aman_Physics', name: 'Aman Singh' },
                { username: 'Neha_Psychology', name: 'Neha Gupta' }
            ];

            const filtered = mockUsers.filter(u => u.username.toLowerCase().includes(query.toLowerCase()) || u.name.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length === 0) {
                resultsDiv.innerHTML = `<p style="font-size: 12px; color: #ef4444; text-align: center;">No user found.</p>`;
                return;
            }

            resultsDiv.innerHTML = '';
            filtered.forEach(u => {
                resultsDiv.innerHTML += `
                    <div class="user-result-item">
                        <span><b>${u.name}</b> (@${u.username})</span>
                        <button class="invite-action-btn" onclick="sendInvite('${u.name}')">Send Invite 🚀</button>
                    </div>
                `;
            });
        }

        function sendInvite(username) {
            alert(`Join request / invite successfully sent to ${username}!`);
            closeInviteModal();
        }

        // WebRTC Video Setup
        let localStream;
        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                console.log("Camera access denied.");
            }
        }

        function toggleCamera() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            const btn = document.getElementById('camToggleBtn');
            btn.classList.toggle('active');
            btn.innerText = videoTrack.enabled ? "Cam On" : "Cam Off";
        }

        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('micToggleBtn');
            btn.classList.toggle('active');
            btn.innerText = audioTrack.enabled ? "Mic On" : "Mic Off";
        }

        startCamera();
    </script>
</body>
</html>
