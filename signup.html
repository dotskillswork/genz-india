<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #111827;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1f2937;
            width: 100%;
            max-width: 450px;
        }
        .auth-card h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .auth-card input {
            width: 100%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }
        .row-group {
            display: flex;
            gap: 10px;
        }
        .row-group .form-group {
            flex: 1;
        }
        .submit-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #0ea5e9;
        }
        .auth-link {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }
        .auth-link a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Join Gen'Z India ⚡</h2>
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="sName" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="form-group">
                <label>Unique Username (e.g. rahul_dev)</label>
                <input type="text" id="sUsername" placeholder="rahul_dev" required>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="sEmailReal" placeholder="name@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="sPass" placeholder="••••••••" required>
                </div>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="sCity" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>District / State</label>
                    <input type="text" id="sState" placeholder="State" required>
                </div>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>College Name</label>
                    <input type="text" id="sCollege" placeholder="College / University" required>
                </div>
                <div class="form-group">
                    <label>Course & Year</label>
                    <input type="text" id="sCourse" placeholder="e.g. B.Tech 2nd Year" required>
                </div>
            </div>
            <div class="form-group">
                <label>Profile Photo</label>
                <input type="file" id="sPhoto" accept="image/*" style="font-size: 11px; color: #94a3b8;">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
            <div class="auth-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </form>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function convertImageToBase64(fileInputId) {
            return new Promise((resolve) => {
                const fileInput = document.getElementById(fileInputId);
                if(fileInput && fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    resolve("");
                }
            });
        }

        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Creating Account...";
            btn.disabled = true;

            let name = document.getElementById('sName').value.trim();
            let username = document.getElementById('sUsername').value.trim().toLowerCase().replace('@','');
            let email = document.getElementById('sEmailReal').value.trim();
            let password = document.getElementById('sPass').value.trim();
            let city = document.getElementById('sCity').value.trim();
            let state = document.getElementById('sState').value.trim();
            let college = document.getElementById('sCollege').value.trim();
            let course = document.getElementById('sCourse').value.trim();
            let photoBase64 = await convertImageToBase64('sPhoto');

            try {
                // Check if Username is already taken
                const q = query(collection(db, "users"), where("username", "==", username));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    alert('Username already taken! Please choose another unique username.');
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    return;
                }

                // Check if Email is already registered
                const qEmail = query(collection(db, "users"), where("email", "==", email));
                const emailSnapshot = await getDocs(qEmail);

                if (!emailSnapshot.empty) {
                    alert('This email is already registered! Please login.');
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    return;
                }

                // Save user to Firestore
                let userData = {
                    name,
                    username,
                    email,
                    password,
                    city,
                    state,
                    college,
                    course,
                    photo: photoBase64
                };

                await addDoc(collection(db, "users"), userData);
                alert('Account created successfully! Please login.');
                window.location.href = 'login.html';

            } catch(e) {
                console.error("Signup Error: ", e);
                alert('Error creating account. Check console or try again.');
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
