<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .auth-card h2 {
            color: #0284c7;
            margin-bottom: 24px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .auth-card input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .row-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .row-group .form-group {
            flex: 1;
            min-width: 180px;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12.5px;
            color: #64748b;
        }
        .auth-link a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Join Gen'Z India ⚡</h2>
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="sName" placeholder="e.g. Rahul Sharma" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label>Unique Username (e.g. rahul_dev)</label>
                <input type="text" id="sUsername" placeholder="rahul_dev" autocomplete="username" required>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="sEmailReal" placeholder="name@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="sPass" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="sCity" placeholder="City" autocomplete="address-level2" required>
                </div>
                <div class="form-group">
                    <label>District / State</label>
                    <input type="text" id="sState" placeholder="State" autocomplete="address-level1" required>
                </div>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>College Name</label>
                    <input type="text" id="sCollege" placeholder="College / University" autocomplete="organization" required>
                </div>
                <div class="form-group">
                    <label>Course & Year</label>
                    <input type="text" id="sCourse" placeholder="e.g. B.Tech 2nd Year" autocomplete="off" required>
                </div>
            </div>
            <div class="form-group">
                <label>Profile Photo (Optional)</label>
                <input type="file" id="sPhoto" accept="image/*" style="font-size: 12px; color: #64748b; background: transparent; border: none; padding: 4px 0;">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
            <div class="auth-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </form>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function convertAndCompressImage(fileInputId) {
            return new Promise((resolve) => {
                const fileInput = document.getElementById(fileInputId);
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxDim = 300;

                            if (width > height) {
                                if (width > maxDim) {
                                    height = Math.round((height * maxDim) / width);
                                    width = maxDim;
                                }
                            } else {
                                if (height > maxDim) {
                                    width = Math.round((width * maxDim) / height);
                                    height = maxDim;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                        img.onerror = () => resolve("");
                        img.src = e.target.result;
                    };
                    reader.onerror = () => resolve("");
                    reader.readAsDataURL(file);
                } else {
                    resolve("");
                }
            });
        }

        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Creating Account...";
            btn.disabled = true;

            let name = document.getElementById('sName').value.trim();
            let username = document.getElementById('sUsername').value.trim().toLowerCase().replace('@','');
            let email = document.getElementById('sEmailReal').value.trim().toLowerCase();
            let password = document.getElementById('sPass').value.trim();
            let city = document.getElementById('sCity').value.trim();
            let state = document.getElementById('sState').value.trim();
            let college = document.getElementById('sCollege').value.trim();
            let course = document.getElementById('sCourse').value.trim();

            try {
                let photoBase64 = await convertAndCompressImage('sPhoto');

                const qUser = query(collection(db, "users"), where("username", "==", username));
                const queryUserSnapshot = await getDocs(qUser);

                if (!queryUserSnapshot.empty) {
                    alert('Username already taken! Please choose another unique username.');
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    return;
                }

                const qEmail = query(collection(db, "users"), where("email", "==", email));
                const emailSnapshot = await getDocs(qEmail);

                if (!emailSnapshot.empty) {
                    alert('This email is already registered! Please login.');
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    return;
                }

                let userData = {
                    name: name,
                    username: username,
                    email: email,
                    password: password,
                    city: city,
                    state: state,
                    college: college,
                    course: course,
                    photo: photoBase64,
                    profilePic: photoBase64,
                    createdAt: Date.now()
                };

                await addDoc(collection(db, "users"), userData);
                alert('Account created successfully! Please login.');
                window.location.href = 'login.html';

            } catch(e) {
                console.error("Signup Error: ", e);
                alert('Signup Failed: ' + (e.message || 'Please try again.'));
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
