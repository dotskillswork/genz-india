<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748692932635414"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Search Console optimization: Prevent indexing auth pages -->
    <meta name="robots" content="noindex, nofollow">
    <title>Sign Up | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <!-- EmailJS CDN & Initialization -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("7Qbq8WynvIwjUfgiC");
       })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .auth-card h2 {
            color: #0284c7;
            margin-bottom: 24px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .auth-card input, .auth-card select {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .auth-card input:focus, .auth-card select:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .input-with-btn {
            display: flex;
            gap: 8px;
        }
        .input-with-btn input {
            flex: 1;
        }
        .verify-action-btn {
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .verify-action-btn:hover {
            background: #0284c7;
        }
        .verify-action-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .verified-badge {
            color: #16a34a;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            display: none;
        }
        .username-status {
            font-size: 12px;
            margin-top: 4px;
            font-weight: 600;
            display: none;
        }
        .username-status.taken {
            color: #dc2626;
            display: block;
        }
        .username-status.available {
            color: #16a34a;
            display: block;
        }
        .row-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .row-group .form-group {
            flex: 1;
            min-width: 180px;
        }
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 15px 0;
            font-size: 12px;
            color: #475569;
        }
        .terms-group input {
            margin-top: 2px;
            accent-color: #0284c7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .terms-group a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .terms-group a:hover {
            text-decoration: underline;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        /* Grand Success Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .success-modal {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .success-modal {
            transform: scale(1);
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
            animation: rocketFloat 2s ease-in-out infinite;
        }
        @keyframes rocketFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .success-modal h3 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .success-modal p {
            color: #64748b;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Join Gen'Z India ⚡</h2>
        <div id="errorAlert" class="error-msg"></div>
        <form id="signupForm">
            <!-- 1. Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="sName" placeholder="e.g. Rahul Sharma" autocomplete="name" required>
            </div>
            
            <!-- 2. Unique Username with Live Availability Check -->
            <div class="form-group">
                <label>Unique Username</label>
                <input type="text" id="sUsername" placeholder="rahul_dev" autocomplete="username" oninput="checkUsernameAvailability()" required>
                <div id="usernameStatus" class="username-status"></div>
            </div>

            <!-- 3. Student Type -->
            <div class="form-group">
                <label>Student Type</label>
                <select id="sStudentType" required>
                    <option value="">-- Select Type --</option>
                    <option value="School">School Student</option>
                    <option value="College">College Student</option>
                </select>
            </div>

            <!-- 4. University or Board (Manual Input) -->
            <div class="form-group">
                <label>University / Board Name</label>
                <input type="text" id="sUniversityBoard" placeholder="e.g. CBSE / Delhi University" required>
            </div>

            <!-- 5. College or School Name (Manual Input) -->
            <div class="form-group">
                <label>College / School Name</label>
                <input type="text" id="sInstitution" placeholder="e.g. St. Xavier's / DAV Public" required>
            </div>

            <!-- 6. Course or Class (Manual Input) -->
            <div class="form-group">
                <label>Course / Class</label>
                <input type="text" id="sCourse" placeholder="e.g. B.Tech 2nd Year or Class 12th" required>
            </div>

            <!-- 7. Address Fields -->
            <div class="row-group">
                <div class="form-group">
                    <label>Area / Locality</label>
                    <input type="text" id="sArea" placeholder="Area" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="sCity" placeholder="City" required>
                </div>
            </div>
            <div class="row-group">
                <div class="form-group">
                    <label>District</label>
                    <input type="text" id="sDistrict" placeholder="District" required>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="sState" placeholder="State" required>
                </div>
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="sCountry" placeholder="Country" value="India" required>
            </div>

            <!-- 8. Mobile Number -->
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="sMobile" placeholder="9876543210" pattern="[0-9]{10}" autocomplete="tel" required>
            </div>

            <!-- 9. Email Address with EmailJS Real OTP Verification -->
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-with-btn">
                    <input type="email" id="sEmailReal" placeholder="name@email.com" autocomplete="email" required>
                    <button type="button" class="verify-action-btn" id="emailVerifyBtn" onclick="triggerEmailVerification()">Verify Email</button>
                </div>
                <div id="emailOtpGroup" style="display:none; margin-top:8px;" class="input-with-btn">
                    <input type="text" id="emailOtpInput" placeholder="Enter 6-digit OTP">
                    <button type="button" class="verify-action-btn" onclick="confirmEmailOtp()">Submit OTP</button>
                </div>
                <div id="emailVerifiedBadge" class="verified-badge">✓ Email Verified Successfully</div>
            </div>

            <!-- Password & DOB -->
            <div class="row-group">
                <div class="form-group">
                    <label>Password (Min 6 chars)</label>
                    <input type="password" id="sPass" placeholder="••••••••" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="sDob" autocomplete="bday" required>
                </div>
            </div>

            <!-- Profile Photo -->
            <div class="form-group">
                <label>Profile Photo (Optional)</label>
                <input type="file" id="sPhoto" accept="image/*" style="font-size: 12px; color: #64748b; background: transparent; border: none; padding: 4px 0;">
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="terms-group">
                <input type="checkbox" id="termsCheck" required>
                <label for="termsCheck" style="display:inline; font-size:12px; color:#475569; font-weight:normal;">
                    I agree to the <a href="terms.html" target="_blank">Terms & Conditions</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Create Account 🚀</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <!-- Grand Success Modal Popup -->
    <div id="successModal" class="modal-overlay">
        <div class="success-modal">
            <div class="success-icon">🚀</div>
            <h3>Account Created!</h3>
            <p>Liftoff successful! Redirecting securely to your dashboard login...</p>
            <button class="modal-btn" onclick="redirectToLogin()">Continue to Login</button>
        </div>
    </div>

    <!-- Firebase & Custom Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isEmailVerified = false;
        let generatedOtp = "";
        let isUsernameAvailable = false;

        // Live Username Availability Check
        window.checkUsernameAvailability = async function() {
            const usernameInput = document.getElementById('sUsername').value.trim().toLowerCase().replace('@','');
            const statusDiv = document.getElementById('usernameStatus');

            if (usernameInput.length < 3) {
                statusDiv.style.display = 'none';
                isUsernameAvailable = false;
                return;
            }

            const usernameRegex = /^[a-z0-9_]+$/;
            if (!usernameRegex.test(usernameInput)) {
                statusDiv.className = 'username-status taken';
                statusDiv.innerText = '✕ Use only letters, numbers, and underscores';
                statusDiv.style.display = 'block';
                isUsernameAvailable = false;
                return;
            }

            try {
                const qUser = query(collection(db, "users"), where("username", "==", usernameInput));
                const querySnapshot = await getDocs(qUser);

                if (!querySnapshot.empty) {
                    statusDiv.className = 'username-status taken';
                    statusDiv.innerText = '✕ Not Available (Username already taken)';
                    statusDiv.style.display = 'block';
                    isUsernameAvailable = false;
                } else {
                    statusDiv.className = 'username-status available';
                    statusDiv.innerText = '✓ Username is available!';
                    statusDiv.style.display = 'block';
                    isUsernameAvailable = true;
                }
            } catch (err) {
                console.error("Error checking username:", err);
            }
        };

        // EmailJS Real OTP Trigger
        window.triggerEmailVerification = function() {
            const email = document.getElementById('sEmailReal').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address first.');
                return;
            }

            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

            const templateParams = {
                to_email: email,
                otp: generatedOtp
            };

            emailjs.send('service_bb6u3ua', 'template_i811c92', templateParams)
                .then(function(response) {
                    document.getElementById('emailOtpGroup').style.display = 'flex';
                    document.getElementById('emailVerifyBtn').disabled = true;
                    alert('Verification code successfully sent to ' + email);
                }, function(error) {
                    console.error('FAILED...', error);
                    alert('Failed to send OTP. Please check your EmailJS configuration.');
                });
        };

        window.confirmEmailOtp = function() {
            const userEnteredOtp = document.getElementById('emailOtpInput').value.trim();
            if (userEnteredOtp === generatedOtp && generatedOtp !== "") {
                isEmailVerified = true;
                document.getElementById('emailOtpGroup').style.display = 'none';
                document.getElementById('emailVerifiedBadge').style.display = 'block';
                document.getElementById('sEmailReal').readOnly = true;
                alert('Email verified successfully!');
            } else {
                alert('Invalid OTP. Please enter the correct code received on your email.');
            }
        };

        window.showSuccessModal = function() {
            document.getElementById('successModal').classList.add('active');
            setTimeout(() => {
                redirectToLogin();
            }, 2200);
        };

        window.redirectToLogin = function() {
            window.location.href = 'login.html';
        };

        function convertAndCompressImage(fileInputId) {
            return new Promise((resolve) => {
                const fileInput = document.getElementById(fileInputId);
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxDim = 300;

                            if (width > height) {
                                if (width > maxDim) {
                                    height = Math.round((height * maxDim) / width);
                                    width = maxDim;
                                }
                            } else {
                                if (height > maxDim) {
                                    width = Math.round((width * maxDim) / height);
                                    height = maxDim;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                        img.onerror = () => resolve("");
                        img.src = e.target.result;
                    };
                    reader.onerror = () => resolve("");
                    reader.readAsDataURL(file);
                } else {
                    resolve("");
                }
            });
        }

        // Form Submission
        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.style.display = 'none';

            if (!isUsernameAvailable) {
                errorAlert.innerText = 'Please choose a valid and available username.';
                errorAlert.style.display = 'block';
                return;
            }

            if (!isEmailVerified) {
                errorAlert.innerText = 'Please verify your Email Address using OTP before signing up.';
                errorAlert.style.display = 'block';
                return;
            }

            const termsChecked = document.getElementById('termsCheck').checked;
            if (!termsChecked) {
                errorAlert.innerText = 'Please accept the Terms & Conditions and Privacy Policy.';
                errorAlert.style.display = 'block';
                return;
            }

            btn.innerText = "Creating Account...";
            btn.disabled = true;

            let name = document.getElementById('sName').value.trim();
            let username = document.getElementById('sUsername').value.trim().toLowerCase().replace('@','');
            let studentType = document.getElementById('sStudentType').value;
            let universityBoard = document.getElementById('sUniversityBoard').value.trim();
            let institution = document.getElementById('sInstitution').value.trim();
            let course = document.getElementById('sCourse').value.trim();
            
            let area = document.getElementById('sArea').value.trim();
            let city = document.getElementById('sCity').value.trim();
            let district = document.getElementById('sDistrict').value.trim();
            let state = document.getElementById('sState').value.trim();
            let country = document.getElementById('sCountry').value.trim();

            let mobile = document.getElementById('sMobile').value.trim();
            let email = document.getElementById('sEmailReal').value.trim().toLowerCase();
            let password = document.getElementById('sPass').value.trim();
            let dob = document.getElementById('sDob').value;

            try {
                let photoBase64 = await convertAndCompressImage('sPhoto');

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                let userData = {
                    uid: user.uid,
                    name: name,
                    username: username,
                    studentType: studentType,
                    universityBoard: universityBoard,
                    institution: institution,
                    course: course,
                    area: area,
                    city: city,
                    district: district,
                    state: state,
                    country: country,
                    mobile: mobile,
                    email: email,
                    dob: dob,
                    photo: photoBase64,
                    profilePic: photoBase64,
                    createdAt: Date.now()
                };

                await setDoc(doc(db, "users", user.uid), userData);

                showSuccessModal();

            } catch(e) {
                console.error("Signup Error: ", e);
                let msg = e.message || 'Please try again.';
                if (e.code === 'auth/email-already-in-use') {
                    msg = 'This email is already registered! Please login.';
                } else if (e.code === 'auth/weak-password') {
                    msg = 'Password should be at least 6 characters long.';
                }
                
                errorAlert.innerText = msg;
                errorAlert.style.display = 'block';
                btn.innerText = "Create Account 🚀";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
