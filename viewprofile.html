<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748692932635414"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Gen'Z India 🇮🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Tiranga Gradient Border */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #FF9933, #ffffff, #138808);
            z-index: 1001;
            box-shadow: 0 2px 10px rgba(255, 153, 51, 0.4);
        }

        /* Header Navigation */
        .profile-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            text-decoration: none;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #e2e8f0; }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #ea580c, #16a34a);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Profile Container */
        .profile-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        /* Profile Card Banner Style */
        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .profile-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 90px;
            background: linear-gradient(135deg, #ea580c, #16a34a);
            z-index: 1;
        }
        .profile-avatar {
            position: relative;
            z-index: 2;
            width: 90px; height: 90px;
            border-radius: 50%;
            margin: 30px auto 12px auto;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
            background: #fed7aa;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            position: relative;
            z-index: 2;
        }
        .profile-handle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        .profile-bio {
            font-size: 13.5px;
            color: #334155;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        /* Stats Row */
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            padding: 15px 0;
        }
        .stat-box { text-align: center; }
        .stat-num { font-size: 18px; font-weight: 700; color: #0f172a; }
        .stat-lbl { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Action Buttons */
        .profile-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn-main {
            background: #ea580c;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
        }
        .btn-main:hover { background: #c2410c; transform: translateY(-1px); }
        .btn-sec {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 9px 22px;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sec:hover { background: #e2e8f0; }

        /* Edit Form Box */
        .edit-box {
            display: none;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 18px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: left;
        }
        .edit-box label {
            font-size: 11.5px;
            font-weight: 600;
            color: #9a3412;
            margin-bottom: 4px;
            display: block;
        }
        .edit-box input, .edit-box textarea {
            width: 100%;
            padding: 9px 14px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            background: #fff;
        }

        /* Sections (Friends & Posts) */
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .content-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .friend-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0fdf4;
            color: #16a34a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            margin: 4px;
            border: 1px solid #bbf7d0;
        }
        .post-item-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #334155;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="profile-header">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="header-title">Gen'Z India Profile 🇮🇳</div>
        <button onclick="logoutUser()" style="background:#fef2f2; color:#dc2626; border:1px solid #fecaca; padding:6px 12px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer;">Logout</button>
    </div>

    <div class="profile-container">
        
        <!-- Profile Main Card -->
        <div class="profile-card">
            <img class="profile-avatar" id="profileUserImg" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png" alt="Avatar">
            <h2 class="profile-name" id="profileFullName">User Name</h2>
            <div class="profile-handle" id="profileHandle">@username</div>
            <div class="profile-bio" id="profileBioDisplay">
                🚀 Gen'Z India Community Member<br>
                💡 Innovating, Connecting & Growing Together
            </div>

            <!-- Real Stats -->
            <div class="profile-stats">
                <div class="stat-box">
                    <div class="stat-num" id="postsCountNum">0</div>
                    <div class="stat-lbl">Posts</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="friendsCountNum">0</div>
                    <div class="stat-lbl">Friends</div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="profile-btns">
                <button class="btn-main" onclick="toggleEditForm()">✏️ Edit Profile</button>
                <button class="btn-sec" onclick="navigator.clipboard.writeText(window.location.href); alert('Profile link copied!');">🔗 Share Profile</button>
            </div>

            <!-- Full Edit Form Box (All Signup Fields) -->
            <div class="edit-box" id="editFormBox">
                <h4 style="font-size: 13.5px; font-weight: 700; margin-bottom: 12px; color: #ea580c;">✏️ Edit Your Profile Details</h4>
                
                <label>Full Name</label>
                <input type="text" id="inputNewName" placeholder="Your Name">

                <label>Username</label>
                <input type="text" id="inputNewUsername" placeholder="Username">

                <label>Bio / Tagline</label>
                <textarea id="inputNewBio" rows="2" placeholder="Write something about yourself..."></textarea>

                <label>Profile Image URL (Link)</label>
                <input type="text" id="inputNewPhoto" placeholder="https://example.com/photo.jpg">

                <button onclick="saveProfile()" class="btn-main" style="padding: 8px 18px; font-size: 12px; margin-top: 5px;">Save All Changes</button>
            </div>
        </div>

        <!-- Friends Section -->
        <div class="section-title">🤝 Connected Friends</div>
        <div class="content-card" id="friendsListBox">
            Loading connected friends...
        </div>

        <!-- My Posts Section -->
        <div class="section-title">📢 My Feature Posts & Reports</div>
        <div class="content-card" id="userPostsBox">
            Loading your posts...
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUWeIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKH"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const currentUser = JSON.parse(localStorage.getItem('genzUser'));
        let myDocId = null;

        if (currentUser) {
            updateProfileUI();
            loadUserDataFromFirebase();
        }

        function updateProfileUI() {
            document.getElementById('profileFullName').innerText = currentUser.name || "User";
            document.getElementById('profileHandle').innerText = "@" + (currentUser.username || currentUser.name || "user");
            if(currentUser.bio) {
                document.getElementById('profileBioDisplay').innerHTML = currentUser.bio.replace(/\n/g, '<br>');
            }
            if (currentUser.photo || currentUser.profilePic) {
                document.getElementById('profileUserImg').src = currentUser.photo || currentUser.profilePic;
            }
        }

        function toggleEditForm() {
            const box = document.getElementById('editFormBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            document.getElementById('inputNewName').value = currentUser.name || "";
            document.getElementById('inputNewUsername').value = currentUser.username || currentUser.name || "";
            document.getElementById('inputNewBio').value = currentUser.bio || "";
            document.getElementById('inputNewPhoto').value = currentUser.photo || currentUser.profilePic || "";
        }

        async function saveProfile() {
            const newName = document.getElementById('inputNewName').value.trim();
            const newUsername = document.getElementById('inputNewUsername').value.trim();
            const newBio = document.getElementById('inputNewBio').value.trim();
            const newPhoto = document.getElementById('inputNewPhoto').value.trim();

            if(!newName) { alert("Name cannot be empty!"); return; }

            currentUser.name = newName;
            currentUser.username = newUsername || newName;
            currentUser.bio = newBio;
            if(newPhoto) {
                currentUser.photo = newPhoto;
                currentUser.profilePic = newPhoto;
            }

            localStorage.setItem('genzUser', JSON.stringify(currentUser));
            updateProfileUI();

            if (myDocId) {
                try {
                    await db.collection('users').doc(myDocId).update({
                        name: newName,
                        username: newUsername,
                        bio: newBio,
                        photo: newPhoto,
                        profilePic: newPhoto
                    });
                } catch(err) {
                    console.error("Firestore update error:", err);
                }
            }

            alert("Profile updated successfully! 🎉");
            toggleEditForm();
        }

        async function loadUserDataFromFirebase() {
            if(!currentUser) return;
            const uname = currentUser.username || currentUser.name;
            const name = currentUser.name;

            const friendsBox = document.getElementById('friendsListBox');
            
            try {
                // Fetch directly from the users collection exactly like makefriend.html does
                const userQuery = await db.collection('users').where("username", "==", uname).get();
                let friendItems = [];

                if (!userQuery.empty) {
                    const docSnap = userQuery.docs[0];
                    myDocId = docSnap.id;
                    const userData = docSnap.data();
                    friendItems = userData.friends || [];
                }

                document.getElementById('friendsCountNum').innerText = friendItems.length;

                if (friendItems.length === 0) {
                    friendsBox.innerHTML = "<span style='color: #64748b; font-size: 13px;'>No friends connected yet. Connect via Make Friends!</span>";
                } else {
                    friendsBox.innerHTML = friendItems.map(f => `<div class="friend-chip">🤝 @${f}</div>`).join('');
                }
            } catch(e) {
                console.error(e);
                friendsBox.innerHTML = "<span style='color: #64748b; font-size: 13px;'>Could not load friends list.</span>";
            }

            // Load Posts from features (VoiceUp, Innovations, etc.)
            const postsBox = document.getElementById('userPostsBox');
            let allPosts = [];
            try {
                const voiceSnap = await db.collection("voiceup_reports").get();
                voiceSnap.forEach(doc => {
                    const data = doc.data();
                    if(data.author === name || data.author === uname || data.username === uname) {
                        allPosts.push(`✊ <b>Voice Up:</b> ${data.title || data.text || "Report"}`);
                    }
                });

                const innovSnap = await db.collection("innovations").get();
                innovSnap.forEach(doc => {
                    const data = doc.data();
                    if(data.author === name || data.author === uname || data.username === uname) {
                        allPosts.push(`💡 <b>Innovation:</b> ${data.title || "Project"}`);
                    }
                });

                document.getElementById('postsCountNum').innerText = allPosts.length;
                if(allPosts.length === 0) {
                    postsBox.innerHTML = "<span style='color: #64748b; font-size: 13px;'>No posts shared yet.</span>";
                } else {
                    postsBox.innerHTML = allPosts.map(p => `<div class="post-item-card">${p}</div>`).join('');
                }
            } catch(e) {
                postsBox.innerHTML = "<span style='color: #64748b; font-size: 13px;'>Unable to fetch posts right now.</span>";
            }
        }

        function logoutUser() {
            localStorage.removeItem('genzUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
