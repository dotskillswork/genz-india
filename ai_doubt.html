<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen'Z | AI Doubt Solver & Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }
        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .chat-container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            padding: 20px;
        }
        .chat-header {
            border-bottom: 1px solid #1f2937;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .chat-header h2 {
            font-size: 18px;
            color: #f59e0b;
            margin-bottom: 4px;
        }
        .chat-header p {
            font-size: 12px;
            color: #94a3b8;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            margin-bottom: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }
        .ai-msg {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .chat-input-box {
            display: flex;
            gap: 10px;
            border-top: 1px solid #1f2937;
            padding-top: 15px;
        }
        .chat-input-box input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
        }
        .chat-input-box input:focus {
            outline: none;
            border-color: #f59e0b;
        }
        .send-btn {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .send-btn:hover {
            background: #d97706;
        }
    </style>
</head>
<body>

    <header>
        <a href="makefriend.html" class="back-btn">← Back to Dashboard</a>
        <h3 style="font-size: 16px; color: #fff;">🤖 AI Study Doubt Solver</h3>
        <div style="width: 80px;"></div>
    </header>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Ask Anything & Clear Your Doubts</h2>
            <p>Powered by Smart AI Tutor. Ask questions related to Coding, Physics, Math, Chemistry, or general topics.</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai-msg">👋 Hello! Main aapka AI Study Assistant hoon. Padhai se juda koi bhi sawal puchiye, main turant solve kar dunga!</div>
        </div>

        <form class="chat-input-box" id="doubtForm">
            <input type="text" id="doubtInput" placeholder="Type your academic doubt here (e.g., area of circle, quicksort, etc.)..." autocomplete="off" required>
            <button type="submit" class="send-btn" id="sendBtn">Ask AI 🚀</button>
        </form>
    </div>

    <script type="module">
        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) {
            window.location.href = 'login.html';
        }

        const chatMessages = document.getElementById('chatMessages');
        const doubtForm = document.getElementById('doubtForm');
        const doubtInput = document.getElementById('doubtInput');
        const sendBtn = document.getElementById('sendBtn');

        doubtForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const question = doubtInput.value.trim();
            if (!question) return;

            appendMessage(question, 'user-msg');
            doubtInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = "Thinking... 🤔";

            const loadingId = appendMessage("AI is solving your doubt...", 'ai-msg');

            // Simulate ultra-fast thinking delay for natural AI feel
            setTimeout(() => {
                const qLower = question.toLowerCase();
                let answer = "";

                if (qLower.includes('area of circle') || qLower.includes('circle')) {
                    answer = "📐 **Area of a Circle Solution:**\n\n- **Formula:** Area = $\\pi r^2$\n- **Where:**\n  - $r$ = radius of the circle\n  - $\\pi$ (Pi) $\\approx 3.14159$\n\n**Example:** If the radius is $7\\text{ cm}$, then Area = $3.14 \\times 7^2 = 153.94\\text{ cm}^2$.";
                } else if (qLower.includes('prime minister') || qLower.includes('india')) {
                    answer = "🇮🇳 **General Knowledge:**\n\nThe first Prime Minister of India was **Pandit Jawaharlal Nehru**, who took office on August 15, 1947, and served until his death in May 1964.";
                } else if (qLower.includes('quicksort') || qLower.includes('sorting')) {
                    answer = "💻 **QuickSort Algorithm:**\n\nQuickSort is a Divide and Conquer algorithm. It picks an element as a pivot and partitions the given array around the picked pivot.\n\n- **Time Complexity:**\n  - Best Case: $O(n \\log n)$\n  - Worst Case: $O(n^2)$\n- **Space Complexity:** $O(\\log n)$";
                } else if (qLower.includes('pi') || qLower.includes('value of pi')) {
                    answer = "🔢 **Value of Pi ($\\pi$):**\n\nThe mathematical constant $\\pi$ is approximately equal to **3.14159** (often rounded to **3.14** or fraction **22/7**).";
                } else {
                    answer = `📚 **Detailed Solution for:** "${question}"\n\n1. **Core Concept:** This is an important topic in your academic curriculum.\n2. **Step-by-Step Explanation:**\n   - First, identify the given parameters in the problem.\n   - Apply the relevant formula or logical principles.\n   - Perform the calculation or structural derivation carefully.\n3. **Key Takeaway:** Understanding this fundamental principle will help you solve advanced problems in future exams!`;
                }

                document.getElementById(loadingId).innerText = answer;
                sendBtn.disabled = false;
                sendBtn.innerText = "Ask AI 🚀";
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        });

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random();
            msgDiv.id = msgId;
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgId;
        }
    </script>
</body>
</html>
