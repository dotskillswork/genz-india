<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Gen'Z India 🇮🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fdfbf7; /* Warm Indian Paper Tint */
            color: #1e293b;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Tiranga Border */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(to right, #FF9933, #FFFFFF, #138808);
            z-index: 1001;
        }

        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-left: 1px solid #e7e5e4;
            border-right: 1px solid #e7e5e4;
            height: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e7e5e4;
            z-index: 100;
            flex-shrink: 0;
        }

        .back-btn {
            color: #ea580c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-header {
            padding: 10px 15px;
            background: #fffbeb;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #fed7aa;
            flex-shrink: 0;
            z-index: 99;
        }

        .chat-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffedd5;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ea580c;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #fed7aa;
        }

        .chat-user-info h4 {
            font-size: 14px;
            color: #0f172a;
            font-weight: 600;
        }

        .chat-user-info span {
            font-size: 11px;
            color: #64748b;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fdfbf7;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .message.sent {
            background: #ea580c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #fed7aa;
        }

        .message img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
            cursor: pointer;
        }

        .unsend-hint {
            font-size: 9.5px;
            color: rgba(255,255,255,0.85);
            display: block;
            margin-top: 4px;
            text-align: right;
            font-style: italic;
            cursor: pointer;
            text-decoration: underline;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 2px;
        }

        .msg-time {
            font-size: 9.5px;
            color: rgba(255,255,255,0.85);
        }
        .message.received .msg-time {
            color: #94a3b8;
        }

        .read-receipt {
            font-size: 11px;
            font-weight: 700;
        }
        .read-receipt.read {
            color: #6ee7b7;
        }
        .read-receipt.unread {
            color: rgba(255,255,255,0.7);
        }

        .chat-input-box {
            background: #ffffff;
            padding: 12px 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #e7e5e4;
            flex-shrink: 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }

        .chat-input-box input[type="text"] {
            flex: 1;
            min-width: 0;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            color: #1e293b;
            font-size: 13px;
        }

        .chat-input-box input[type="text"]:focus {
            outline: none;
            border-color: #ea580c;
        }

        .file-upload-label {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #fed7aa;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .send-btn {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.2);
        }
        .send-btn:hover {
            background: #c2410c;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background: #ea580c;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        /* Floating Popup Toast Notification Banner */
        #floatingToast {
            display: none;
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #ffffff;
            border: 2px solid #ea580c;
            border-radius: 14px;
            padding: 15px 20px;
            box-shadow: 0 15px 35px rgba(234, 88, 12, 0.2);
            z-index: 9999;
            max-width: 340px;
            animation: slideUpToast 0.3s ease-in-out;
            cursor: pointer;
        }
        @keyframes slideUpToast {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .toast-title {
            font-size: 13px;
            font-weight: 700;
            color: #ea580c;
        }
        .toast-close {
            background: transparent;
            border: none;
            font-size: 16px;
            color: #64748b;
            cursor: pointer;
        }
        .toast-body {
            font-size: 12px;
            color: #334155;
        }
    </style>
</head>
<body>

    <!-- Floating Popup Toast Container -->
    <div id="floatingToast" onclick="openChatFromToast()">
        <div class="toast-header">
            <span class="toast-title" id="toastTitle">💬 New Notification</span>
            <button class="toast-close" onclick="closeToast(event)">&times;</button>
        </div>
        <div class="toast-body" id="toastBody">You have a new update.</div>
    </div>

    <div class="chat-container">
        <header>
            <a href="chats.html" class="back-btn">← Back to Chats</a>
            <h3 style="font-size: 14px; color: #0f172a; font-weight: 700;">💬 Gen'Z Direct Chat 🇮🇳</h3>
            <div style="width: 50px;"></div>
        </header>

        <div class="chat-header" id="chatHeaderBox">
            <div class="chat-user-avatar" id="headerAvatar">U</div>
            <div class="chat-user-info">
                <h4 id="headerUsername">Loading...</h4>
                <span id="headerStatus">Loading...</span>
            </div>
        </div>
        
        <div class="messages-box" id="messagesBox">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-box">
            <label class="file-upload-label" title="Upload Image">
                📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="image-modal">
        <img id="modalImg" src="" alt="Full View">
        <div class="modal-actions">
            <a id="downloadBtn" class="modal-btn" download="genz_chat.png">📥 Download</a>
            <button class="modal-btn" style="background: #dc2626;" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUWeIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const chatWith = urlParams.get('with');
        if (!chatWith) window.location.href = 'chats.html';

        const chatId = [activeUser.username, chatWith].sort().join('_');
        let selectedImageBase64 = "";

        // Global Alerts & Floating Toast Listener for other messages
        let latestTargetUrl = "chats.html";
        window.openChatFromToast = function() {
            if (latestTargetUrl) {
                window.location.href = latestTargetUrl;
            }
        };

        window.closeToast = function(e) {
            e.stopPropagation();
            document.getElementById('floatingToast').style.display = 'none';
        };

        db.collection('chats').onSnapshot((snapshot) => {
            let unreadList = [];
            snapshot.forEach(docSnap => {
                const m = docSnap.data();
                if (m.receiver === activeUser.username && m.read === false && m.sender !== chatWith) {
                    unreadList.push({
                        sender: m.sender,
                        text: m.text || "Sent an attachment"
                    });
                }
            });

            if (unreadList.length > 0) {
                const latest = unreadList[unreadList.length - 1];
                latestTargetUrl = `chat.html?with=${latest.sender}`;
                document.getElementById('toastTitle').innerText = `💬 New Message from @${latest.sender}`;
                document.getElementById('toastBody').innerText = latest.text;
                document.getElementById('floatingToast').style.display = 'block';
            }
        });

        async function updateMyPresence() {
            try {
                const querySnapshot = await db.collection('users').get();
                querySnapshot.forEach(async (docSnap) => {
                    if (docSnap.data().username === activeUser.username) {
                        await docSnap.ref.update({ lastSeen: Date.now() });
                    }
                });
            } catch (err) { console.error(err); }
        }
        updateMyPresence();
        setInterval(updateMyPresence, 30000);

        // Load Header User Info & Typing Status
        function loadChatUserInfo() {
            db.collection('users').onSnapshot((snapshot) => {
                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.username === chatWith) {
                        document.getElementById('headerUsername').innerText = uData.name || `@${uData.username}`;
                        if (uData.profilePic || uData.photo) {
                            document.getElementById('headerAvatar').innerHTML = `<img src="${uData.profilePic || uData.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            document.getElementById('headerAvatar').innerText = uData.username.charAt(0).toUpperCase();
                        }

                        // Check Typing Status or Online/Offline
                        if (uData.typingTo === activeUser.username) {
                            document.getElementById('headerStatus').innerHTML = `<span style="color: #ea580c; font-weight:600;">typing... ✍️</span>`;
                        } else {
                            const diffSec = (Date.now() - (uData.lastSeen || 0)) / 1000;
                            document.getElementById('headerStatus').innerHTML = diffSec < 60 ? `<span style="color: #16a34a;">● Active</span>` : `<span style="color: #94a3b8;">Offline</span>`;
                        }
                    }
                });
            });
        }
        loadChatUserInfo();

        // Typing Indicator Trigger
        const messageInput = document.getElementById('messageInput');
        let typingTimeout = null;

        messageInput.addEventListener('input', async () => {
            try {
                const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                if (!myQuery.empty) {
                    await myQuery.docs[0].ref.update({ typingTo: chatWith });
                }
            } catch(e) {}

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(async () => {
                try {
                    const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                    if (!myQuery.empty) {
                        await myQuery.docs[0].ref.update({ typingTo: "" });
                    }
                } catch(e) {}
            }, 2000);
        });

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result;
                    document.getElementById('messageInput').placeholder = "Photo attached! Tap Send";
                };
                reader.readAsDataURL(file);
            }
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImageBase64) return;

            try {
                const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                if (!myQuery.empty) {
                    await myQuery.docs[0].ref.update({ typingTo: "" });
                }
            } catch(e) {}

            const messageData = {
                chatId: chatId,
                sender: activeUser.username,
                receiver: chatWith,
                text: text,
                image: selectedImageBase64 || "",
                read: false,
                createdAt: Date.now()
            };

            try {
                await db.collection('chats').add(messageData);
                messageInput.value = "";
                messageInput.placeholder = "Type a message...";
                selectedImageBase64 = "";
                document.getElementById('imageInput').value = "";
            } catch (err) {
                alert("Failed to send.");
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'none';
        });

        // Mark incoming messages as read instantly when opening this chat
        async function markMessagesAsRead() {
            try {
                const msgSnap = await db.collection('chats').get();
                const batch = db.batch();
                msgSnap.forEach(docSnap => {
                    const m = docSnap.data();
                    if (m.chatId === chatId && m.receiver === activeUser.username && m.read === false) {
                        batch.update(docSnap.ref, { read: true });
                    }
                });
                await batch.commit();
            } catch (e) {
                console.error(e);
            }
        }
        markMessagesAsRead();

        const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

        // Realtime Messages Listener with Read Receipts (Double Ticks ✔️✔️)
        db.collection('chats').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
            const box = document.getElementById('messagesBox');
            box.innerHTML = "";
            const currentTime = Date.now();

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const docId = docSnap.id;

                if (msg.chatId === chatId) {
                    if (msg.receiver === activeUser.username && msg.read === false) {
                        db.collection('chats').doc(docId).update({ read: true }).catch(()=>{});
                    }

                    if (currentTime - msg.createdAt > TWENTY_FOUR_HOURS_MS) {
                        db.collection('chats').doc(docId).delete().catch(() => {});
                        return;
                    }

                    const isSent = msg.sender === activeUser.username;
                    const timeString = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

                    if (msg.text) {
                        const textDiv = document.createElement('div');
                        textDiv.innerText = msg.text;
                        msgDiv.appendChild(textDiv);
                    }

                    if (msg.image) {
                        const imgElem = document.createElement('img');
                        imgElem.src = msg.image;
                        imgElem.onclick = (e) => {
                            e.stopImmediatePropagation();
                            document.getElementById('imageModal').style.display = 'flex';
                            document.getElementById('modalImg').src = msg.image;
                            document.getElementById('downloadBtn').href = msg.image;
                        };
                        msgDiv.appendChild(imgElem);
                    }

                    if (isSent) {
                        const unsendHint = document.createElement('span');
                        unsendHint.className = 'unsend-hint';
                        unsendHint.innerText = 'Tap to unsend 🗑️';
                        unsendHint.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm("Kya aap is message ko unsend karna chahte hain?")) {
                                try {
                                    await db.collection('chats').doc(docId).delete();
                                } catch (err) {
                                    alert("Could not delete.");
                                }
                            }
                        };
                        msgDiv.appendChild(unsendHint);
                    }

                    const footerDiv = document.createElement('div');
                    footerDiv.className = 'msg-footer';

                    const timeDiv = document.createElement('span');
                    timeDiv.className = 'msg-time';
                    timeDiv.innerText = timeString;
                    footerDiv.appendChild(timeDiv);

                    // Read Receipt Indicator for Sent Messages (Double Tick)
                    if (isSent) {
                        const readSpan = document.createElement('span');
                        readSpan.className = `read-receipt ${msg.read ? 'read' : 'unread'}`;
                        readSpan.innerText = msg.read ? '✓✓' : '✓';
                        readSpan.title = msg.read ? 'Seen' : 'Sent';
                        footerDiv.appendChild(readSpan);
                    }

                    msgDiv.appendChild(footerDiv);
                    box.appendChild(msgDiv);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
