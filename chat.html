<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            background: #111827;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            width: 100%;
            flex-shrink: 0;
        }

        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            background: #111827;
            overflow: hidden;
        }

        .chat-header {
            padding: 10px 15px;
            background: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        .chat-user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #334155;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-weight: 600;
            font-size: 13px;
        }

        .chat-user-info h4 {
            font-size: 13px;
            color: #f8fafc;
        }

        .chat-user-info span {
            font-size: 10px;
            color: #94a3b8;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .message.sent {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            cursor: pointer;
        }

        .message.received {
            background: #1e293b;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }

        .message img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
            cursor: pointer;
        }

        .unsend-hint {
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            display: block;
            margin-top: 2px;
            text-align: right;
            font-style: italic;
        }

        .msg-time {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            margin-top: 3px;
            text-align: right;
        }

        .chat-input-box {
            padding: 10px 15px;
            background: #1f2937;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #334155;
            width: 100%;
            flex-shrink: 0;
        }

        .chat-input-box input[type="text"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
        }

        .chat-input-box input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .file-upload-label {
            background: #334155;
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .send-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Fullscreen Image Lightbox Modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background: #38bdf8;
            color: #0b0f19;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="makefriend.html" class="back-btn">← Back</a>
        <h3 style="font-size: 14px; color: #fff;">💬 Gen'Z Direct Chat</h3>
        <div style="width: 40px;"></div>
    </header>

    <div class="chat-container">
        <div class="chat-header" id="chatHeaderBox">
            <div class="chat-user-avatar" id="headerAvatar">U</div>
            <div class="chat-user-info">
                <h4 id="headerUsername">Loading...</h4>
                <span id="headerStatus">Loading...</span>
            </div>
        </div>
        
        <div class="messages-box" id="messagesBox">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-box">
            <label class="file-upload-label" title="Upload Image">
                📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="image-modal">
        <img id="modalImg" src="" alt="Full View">
        <div class="modal-actions">
            <a id="downloadBtn" class="modal-btn" download="genz_chat.png">📥 Download</a>
            <button class="modal-btn" style="background: #ef4444; color: #fff;" onclick="closeImageModal()">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const chatWith = urlParams.get('with');
        if (!chatWith) window.location.href = 'makefriend.html';

        // Security blur on tab switch
        window.addEventListener('blur', () => document.body.style.filter = "blur(15px)");
        window.addEventListener('focus', () => document.body.style.filter = "none");

        async function updateMyPresence() {
            try {
                const querySnapshot = await getDocs(collection(db, 'users'));
                querySnapshot.forEach(async (docSnap) => {
                    if (docSnap.data().username === activeUser.username) {
                        await updateDoc(doc(db, 'users', docSnap.id), { lastSeen: Date.now() });
                    }
                });
            } catch (err) { console.error(err); }
        }
        updateMyPresence();
        setInterval(updateMyPresence, 30000);

        function loadChatUserInfo() {
            onSnapshot(collection(db, 'users'), (snapshot) => {
                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.username === chatWith) {
                        document.getElementById('headerUsername').innerText = `@${uData.username}`;
                        if (uData.profilePic) {
                            document.getElementById('headerAvatar').innerHTML = `<img src="${uData.profilePic}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            document.getElementById('headerAvatar').innerText = uData.username.charAt(0).toUpperCase();
                        }
                        const diffSec = (Date.now() - (uData.lastSeen || 0)) / 1000;
                        document.getElementById('headerStatus').innerHTML = diffSec < 60 ? `<span style="color: #34d399;">● Active</span>` : `<span style="color: #94a3b8;">Offline</span>`;
                    }
                });
            });
        }
        loadChatUserInfo();

        const chatId = [activeUser.username, chatWith].sort().join('_');
        let selectedImageBase64 = "";

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result;
                    document.getElementById('messageInput').placeholder = "Photo attached! Tap Send";
                };
                reader.readAsDataURL(file);
            }
        });

        async function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (!text && !selectedImageBase64) return;

            const messageData = {
                chatId: chatId,
                sender: activeUser.username,
                receiver: chatWith,
                text: text,
                image: selectedImageBase64 || "",
                createdAt: Date.now()
            };

            try {
                await addDoc(collection(db, 'chats'), messageData);
                document.getElementById('messageInput').value = "";
                document.getElementById('messageInput').placeholder = "Type a message...";
                selectedImageBase64 = "";
                document.getElementById('imageInput').value = "";
            } catch (err) {
                alert("Failed to send.");
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        window.unsendMessage = async (docId, sender) => {
            if (sender === activeUser.username) {
                if (confirm("Kya aap is message ko unsend karna chahte hain?")) {
                    try {
                        await deleteDoc(doc(db, 'chats', docId));
                    } catch (err) {
                        alert("Could not delete.");
                    }
                }
            }
        };

        window.openImageModal = (src) => {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('modalImg').src = src;
            document.getElementById('downloadBtn').href = src;
        };

        window.closeImageModal = () => {
            document.getElementById('imageModal').style.display = 'none';
        };

        const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

        const q = query(collection(db, 'chats'), orderBy('createdAt', 'asc'));
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('messagesBox');
            box.innerHTML = "";
            const currentTime = Date.now();

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const docId = docSnap.id;

                if (msg.chatId === chatId) {
                    if (currentTime - msg.createdAt > TWENTY_FOUR_HOURS_MS) {
                        deleteDoc(doc(db, 'chats', docId)).catch(() => {});
                        return;
                    }

                    const isSent = msg.sender === activeUser.username;
                    const timeString = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const imageTag = msg.image ? `<img src="${msg.image}" onclick="window.openImageModal('${msg.image}')">` : "";
                    const unsendHint = isSent ? `<span class="unsend-hint">Tap to unsend 🗑️</span>` : "";

                    box.innerHTML += `
                        <div class="message ${isSent ? 'sent' : 'received'}" ${isSent ? `onclick="window.unsendMessage('${docId}', '${msg.sender}')"` : ''}>
                            ${msg.text ? `<div>${msg.text}</div>` : ""}
                            ${imageTag}
                            ${unsendHint}
                            <div class="msg-time">${timeString}</div>
                        </div>
                    `;
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
