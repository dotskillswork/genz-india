<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            background: #111827;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #111827;
            border-left: 1px solid #1f2937;
            border-right: 1px solid #1f2937;
        }

        .chat-header {
            padding: 8px 15px;
            background: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #334155;
        }

        .chat-user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #334155;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-weight: 600;
            font-size: 12px;
        }

        .chat-user-info h4 {
            font-size: 13px;
            color: #f8fafc;
        }

        .chat-user-info span {
            font-size: 10px;
            color: #94a3b8;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .message.sent {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            background: #1e293b;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }

        .message img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
            cursor: pointer;
        }

        .unsend-hint {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            display: block;
            margin-top: 4px;
            text-align: right;
            font-style: italic;
            cursor: pointer;
            text-decoration: underline;
        }

        .msg-time {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
            text-align: right;
        }

        .chat-input-box {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1f2937;
            padding: 8px 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            border-top: 1px solid #334155;
            z-index: 999;
            box-sizing: border-box;
        }

        @media (min-width: 800px) {
            .chat-input-box {
                width: 800px;
                left: 50%;
                transform: translateX(-50%);
            }
        }

        .chat-input-box input[type="text"] {
            flex: 1;
            min-width: 0;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 13px;
        }

        .chat-input-box input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .file-upload-label {
            background: #334155;
            color: #38bdf8;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .send-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background: #38bdf8;
            color: #0b0f19;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <a href="makefriend.html" class="back-btn">← Back</a>
            <h3 style="font-size: 14px; color: #fff;">💬 Gen'Z Direct Chat</h3>
            <div style="width: 35px;"></div>
        </header>

        <div class="chat-header" id="chatHeaderBox">
            <div class="chat-user-avatar" id="headerAvatar">U</div>
            <div class="chat-user-info">
                <h4 id="headerUsername">Loading...</h4>
                <span id="headerStatus">Loading...</span>
            </div>
        </div>
        
        <div class="messages-box" id="messagesBox">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-box">
            <label class="file-upload-label" title="Upload Image">
                📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="image-modal">
        <img id="modalImg" src="" alt="Full View">
        <div class="modal-actions">
            <a id="downloadBtn" class="modal-btn" download="genz_chat.png">📥 Download</a>
            <button class="modal-btn" style="background: #ef4444; color: #fff;" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        // Service Worker Registration for Push Notifications
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/firebase-messaging-sw.js')
                    .then((reg) => console.log('Service Worker registered successfully'))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }

        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) window.location.href = 'login.html';

        // Request Browser Notification Permission
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Request FCM Token and Save
        async function requestNotificationPermission() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await getToken(messaging, { 
                        vapidKey: "BHAI_YAHAN_APNI_FIREBASE_WEB_PUSH_CERTIFICATE_KEY_DALNI_HOGI" 
                    });
                    
                    if (token) {
                        const querySnapshot = await getDocs(collection(db, 'users'));
                        querySnapshot.forEach(async (docSnap) => {
                            if (docSnap.data().username === activeUser.username) {
                                await updateDoc(doc(db, 'users', docSnap.id), { fcmToken: token });
                            }
                        });
                    }
                }
            } catch (err) {
                console.log('Notification permission or token error:', err);
            }
        }
        requestNotificationPermission();

        const urlParams = new URLSearchParams(window.location.search);
        const chatWith = urlParams.get('with');
        if (!chatWith) window.location.href = 'makefriend.html';

        window.addEventListener('blur', () => document.body.style.filter = "blur(15px)");
        window.addEventListener('focus', () => document.body.style.filter = "none");

        async function updateMyPresence() {
            try {
                const querySnapshot = await getDocs(collection(db, 'users'));
                querySnapshot.forEach(async (docSnap) => {
                    if (docSnap.data().username === activeUser.username) {
                        await updateDoc(doc(db, 'users', docSnap.id), { lastSeen: Date.now() });
                    }
                });
            } catch (err) { console.error(err); }
        }
        updateMyPresence();
        setInterval(updateMyPresence, 30000);

        function loadChatUserInfo() {
            onSnapshot(collection(db, 'users'), (snapshot) => {
                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.username === chatWith) {
                        document.getElementById('headerUsername').innerText = `@${uData.username}`;
                        if (uData.profilePic) {
                            document.getElementById('headerAvatar').innerHTML = `<img src="${uData.profilePic}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            document.getElementById('headerAvatar').innerText = uData.username.charAt(0).toUpperCase();
                        }
                        const diffSec = (Date.now() - (uData.lastSeen || 0)) / 1000;
                        document.getElementById('headerStatus').innerHTML = diffSec < 60 ? `<span style="color: #34d399;">● Active</span>` : `<span style="color: #94a3b8;">Offline</span>`;
                    }
                });
            });
        }
        loadChatUserInfo();

        const chatId = [activeUser.username, chatWith].sort().join('_');
        let selectedImageBase64 = "";

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result;
                    document.getElementById('messageInput').placeholder = "Photo attached! Tap Send";
                };
                reader.readAsDataURL(file);
            }
        });

        async function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (!text && !selectedImageBase64) return;

            const messageData = {
                chatId: chatId,
                sender: activeUser.username,
                receiver: chatWith,
                text: text,
                image: selectedImageBase64 || "",
                createdAt: Date.now()
            };

            try {
                await addDoc(collection(db, 'chats'), messageData);
                document.getElementById('messageInput').value = "";
                document.getElementById('messageInput').placeholder = "Type a message...";
                selectedImageBase64 = "";
                document.getElementById('imageInput').value = "";
            } catch (err) {
                alert("Failed to send.");
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'none';
        });

        const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

        const q = query(collection(db, 'chats'), orderBy('createdAt', 'asc'));
        
        let isFirstLoad = true;
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('messagesBox');
            box.innerHTML = "";
            const currentTime = Date.now();

            snapshot.docChanges().forEach((change) => {
                if (change.type === "added" && !isFirstLoad) {
                    const msg = change.doc.data();
                    // Agar message mujhe mila hai aur sender ye current chat wala user nahi hai ya tab bhi jab background/foreground me notification chahiye
                    if (msg.receiver === activeUser.username && msg.sender !== chatWith) {
                        if (Notification.permission === "granted") {
                            const notification = new Notification(`New message from @${msg.sender}`, {
                                body: msg.text || "Sent an attachment",
                                icon: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/26a1.png"
                            });

                            notification.onclick = function() {
                                window.focus();
                                window.location.href = `chat.html?with=${msg.sender}`;
                            };
                        }
                    }
                }
            });

            isFirstLoad = false;

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const docId = docSnap.id;

                if (msg.chatId === chatId) {
                    if (currentTime - msg.createdAt > TWENTY_FOUR_HOURS_MS) {
                        deleteDoc(doc(db, 'chats', docId)).catch(() => {});
                        return;
                    }

                    const isSent = msg.sender === activeUser.username;
                    const timeString = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

                    if (msg.text) {
                        const textDiv = document.createElement('div');
                        textDiv.innerText = msg.text;
                        msgDiv.appendChild(textDiv);
                    }

                    if (msg.image) {
                        const imgElem = document.createElement('img');
                        imgElem.src = msg.image;
                        
                        imgElem.onclick = (e) => {
                            e.stopImmediatePropagation();
                            e.stopPropagation();
                            document.getElementById('imageModal').style.display = 'flex';
                            document.getElementById('modalImg').src = msg.image;
                            document.getElementById('downloadBtn').href = msg.image;
                        };
                        
                        msgDiv.appendChild(imgElem);
                    }

                    if (isSent) {
                        const unsendHint = document.createElement('span');
                        unsendHint.className = 'unsend-hint';
                        unsendHint.innerText = 'Tap to unsend 🗑️';
                        unsendHint.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm("Kya aap is message ko unsend karna chahte hain?")) {
                                try {
                                    await deleteDoc(doc(db, 'chats', docId));
                                } catch (err) {
                                    alert("Could not delete.");
                                }
                            }
                        };
                        msgDiv.appendChild(unsendHint);
                    }

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'msg-time';
                    timeDiv.innerText = timeString;
                    msgDiv.appendChild(timeDiv);

                    box.appendChild(msgDiv);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
