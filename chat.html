<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Gen'Z India 🇮🇳</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            background-color: #f8fafc;
            color: #1e293b;
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Tiranga Border */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(to right, #FF9933, #FFFFFF, #138808);
            z-index: 1001;
        }

        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-left: 1px solid #e7e5e4;
            border-right: 1px solid #e7e5e4;
            height: 100%;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Study & Focus Chat Box Themes */
        .chat-container.theme-study-library {
            background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 50%, #fef3c7 100%) !important;
        }
        .chat-container.theme-cozy-cafe {
            background: linear-gradient(135deg, #ffedd5, #fef2f2, #fff7ed) !important;
        }
        .chat-container.theme-midnight-focus {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a) !important;
            color: #f8fafc !important;
        }
        .chat-container.theme-classic-paper {
            background: #ffffff !important;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e7e5e4;
            z-index: 100;
            flex-shrink: 0;
            flex-wrap: nowrap;
            gap: 8px;
        }
        .theme-midnight-focus header {
            background: rgba(30, 41, 59, 0.95) !important;
            border-color: #334155;
            color: #f8fafc;
        }

        .back-btn {
            color: #ea580c;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .chat-header {
            padding: 10px 15px;
            background: #fffbeb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #fed7aa;
            flex-shrink: 0;
            z-index: 99;
        }
        .theme-midnight-focus .chat-header {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        .chat-user-main {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .chat-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffedd5;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ea580c;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #fed7aa;
            flex-shrink: 0;
        }

        .chat-user-info {
            min-width: 0;
        }

        .chat-user-info h4 {
            font-size: 14px;
            color: #0f172a;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .theme-midnight-focus .chat-user-info h4 { color: #f8fafc !important; }

        .chat-user-info span {
            font-size: 11px;
            color: #64748b;
        }

        /* 3-Dot Control Menu */
        .chat-menu-container {
            position: relative;
            flex-shrink: 0;
        }
        .chat-three-dot {
            background: transparent;
            border: none;
            font-size: 22px;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
        }
        .theme-midnight-focus .chat-three-dot { color: #cbd5e1; }
        .chat-three-dot:hover { background: rgba(0,0,0,0.05); }

        .chat-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 210px;
            z-index: 1000;
            overflow: hidden;
        }
        .chat-dropdown.show { display: block; }
        
        .chat-dropdown-item {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
        }
        .chat-dropdown-item:hover {
            background: #fff7ed;
            color: #ea580c;
        }

        /* Nested Theme Submenu Container */
        .theme-submenu {
            display: none;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }
        .theme-submenu.show {
            display: block;
        }
        .theme-sub-item {
            padding: 8px 14px 8px 28px;
            font-size: 11px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-sub-item:hover {
            background: #fff7ed;
            color: #ea580c;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: transparent;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .message.sent {
            background: #ea580c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #fed7aa;
        }
        .theme-midnight-focus .message.received {
            background: #334155 !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
        }

        .message img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
            cursor: pointer;
        }

        .unsend-hint {
            font-size: 9.5px;
            color: rgba(255,255,255,0.85);
            display: block;
            margin-top: 4px;
            text-align: right;
            font-style: italic;
            cursor: pointer;
            text-decoration: underline;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 2px;
        }

        .msg-time {
            font-size: 9.5px;
            color: rgba(255,255,255,0.85);
        }
        .message.received .msg-time {
            color: #94a3b8;
        }

        .read-receipt {
            font-size: 11px;
            font-weight: 700;
        }
        .read-receipt.read { color: #6ee7b7; }
        .read-receipt.unread { color: rgba(255,255,255,0.7); }

        .chat-input-box {
            background: #ffffff;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #e7e5e4;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }
        .theme-midnight-focus .chat-input-box {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        .chat-input-box input[type="text"] {
            flex: 1;
            min-width: 0;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 9px 12px;
            color: #1e293b;
            font-size: 13px;
        }
        .theme-midnight-focus .chat-input-box input[type="text"] {
            background: #0f172a !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
        }

        .chat-input-box input[type="text"]:focus {
            outline: none;
            border-color: #ea580c;
        }

        .file-upload-label {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #fed7aa;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }

        .send-btn {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.2);
        }
        .send-btn:hover { background: #c2410c; }

        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .image-modal img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
        }
        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .modal-btn {
            background: #ea580c;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="chat-container theme-classic-paper" id="chatContainerBox">
        <header>
            <a href="chats.html" class="back-btn">← Back</a>
            <h3 style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;">💬 Gen'Z Direct Chat 🇮🇳</h3>
            <div style="width: 20px;"></div>
        </header>

        <!-- Chat Header with 3-Dot Options Menu -->
        <div class="chat-header" id="chatHeaderBox">
            <div class="chat-user-main">
                <div class="chat-user-avatar" id="headerAvatar">U</div>
                <div class="chat-user-info">
                    <h4 id="headerUsername">Loading...</h4>
                    <span id="headerStatus">Loading...</span>
                </div>
            </div>

            <!-- 3-Dot Control Menu -->
            <div class="chat-menu-container">
                <button class="chat-three-dot" onclick="toggleChatMenu(event)">⋮</button>
                <div class="chat-dropdown" id="chatDropdown" onclick="event.stopPropagation()">
                    
                    <!-- Change Theme Main Button with Submenu -->
                    <div class="chat-dropdown-item" onclick="toggleThemeSubmenu(event)">
                        🎨 Change Theme ▾
                    </div>
                    <div class="theme-submenu" id="themeSubmenu">
                        <div class="theme-sub-item" onclick="changeChatTheme('theme-classic-paper')">📚 Classic Paper</div>
                        <div class="theme-sub-item" onclick="changeChatTheme('theme-study-library')">☕ Calm Library Vibe</div>
                        <div class="theme-sub-item" onclick="changeChatTheme('theme-cozy-cafe')">☕ Cozy Café Study</div>
                        <div class="theme-sub-item" onclick="changeChatTheme('theme-midnight-focus')">🌙 Midnight Focus</div>
                    </div>

                    <div class="chat-dropdown-item" onclick="deleteAllChats()" style="color: #d97706;">🗑️ Delete All Chat</div>
                    <div class="chat-dropdown-item" onclick="blockThisUser()" style="color: #dc2626;">🚫 Block this ID</div>
                    <div class="chat-dropdown-item" onclick="reportThisUser()" style="color: #ea580c;">⚠️ Report User</div>
                </div>
            </div>
        </div>
        
        <div class="messages-box" id="messagesBox">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-box">
            <label class="file-upload-label" title="Upload Image">
                📷 <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="image-modal">
        <img id="modalImg" src="" alt="Full View">
        <div class="modal-actions">
            <a id="downloadBtn" class="modal-btn" download="genz_chat.png">📥 Download</a>
            <button class="modal-btn" style="background: #dc2626;" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUWeIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const chatWith = urlParams.get('with');
        if (!chatWith) window.location.href = 'chats.html';

        const chatId = [activeUser.username, chatWith].sort().join('_');
        let selectedImageBase64 = "";

        // 3-Dot Dropdown Toggle Logic
        function toggleChatMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('chatDropdown');
            dropdown.classList.toggle('show');
        }

        function toggleThemeSubmenu(e) {
            e.stopPropagation();
            const submenu = document.getElementById('themeSubmenu');
            submenu.classList.toggle('show');
        }

        window.addEventListener('click', function() {
            const dropdown = document.getElementById('chatDropdown');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
                document.getElementById('themeSubmenu').classList.remove('show');
            }
        });

        // Theme Switcher Function
        function changeChatTheme(themeName) {
            const container = document.getElementById('chatContainerBox');
            container.className = "chat-container " + themeName;
            localStorage.setItem('preferred_chat_theme_' + activeUser.username, themeName);
            document.getElementById('chatDropdown').classList.remove('show');
            document.getElementById('themeSubmenu').classList.remove('show');
        }

        // Load saved theme on start
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('preferred_chat_theme_' + activeUser.username);
            if (savedTheme) {
                document.getElementById('chatContainerBox').className = "chat-container " + savedTheme;
            }
        });

        // --- DELETE ALL CHAT FEATURE ---
        async function deleteAllChats() {
            if (!confirm("Are you sure you want to delete all messages in this conversation?")) return;
            try {
                const snapshot = await db.collection('chats').get();
                const batch = db.batch();
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    if (m.chatId === chatId) {
                        batch.delete(docSnap.ref);
                    }
                });
                await batch.commit();
                alert("All chat history deleted successfully.");
                document.getElementById('chatDropdown').classList.remove('show');
            } catch(err) {
                console.error(err);
                alert("Failed to delete chat history.");
            }
        }

        // --- BLOCK USER FEATURE ---
        async function blockThisUser() {
            if (!confirm(`Are you sure you want to block @${chatWith}? You will no longer receive messages from them.`)) return;
            try {
                const userQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                if (!userQuery.empty) {
                    const docRef = userQuery.docs[0].ref;
                    const data = userQuery.docs[0].data();
                    let blocked = data.blockedUsers || [];
                    if (!blocked.includes(chatWith)) blocked.push(chatWith);
                    let friends = (data.friends || []).filter(f => f !== chatWith);
                    
                    await docRef.update({
                        blockedUsers: blocked,
                        friends: friends
                    });
                }
                alert(`User @${chatWith} has been blocked successfully.`);
                window.location.href = 'chats.html';
            } catch(err) {
                console.error(err);
                alert("Failed to block user.");
            }
        }

        // --- REPORT USER FEATURE ---
        async function reportThisUser() {
            const reason = prompt(`Please enter the reason for reporting @${chatWith}:`, "Spam or inappropriate behavior");
            if (!reason) return;
            try {
                await db.collection('reports').add({
                    reportedBy: activeUser.username,
                    reportedUser: chatWith,
                    reason: reason,
                    createdAt: Date.now()
                });
                alert("Report submitted successfully. Our moderator team will review it.");
                document.getElementById('chatDropdown').classList.remove('show');
            } catch(err) {
                console.error(err);
                alert("Failed to submit report.");
            }
        }

        async function updateMyPresence() {
            try {
                const querySnapshot = await db.collection('users').get();
                querySnapshot.forEach(async (docSnap) => {
                    if (docSnap.data().username === activeUser.username) {
                        await docSnap.ref.update({ lastSeen: Date.now() });
                    }
                });
            } catch (err) {}
        }
        updateMyPresence();
        setInterval(updateMyPresence, 30000);

        function loadChatUserInfo() {
            db.collection('users').onSnapshot((snapshot) => {
                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.username === chatWith) {
                        document.getElementById('headerUsername').innerText = uData.name || `@${uData.username}`;
                        if (uData.profilePic || uData.photo) {
                            document.getElementById('headerAvatar').innerHTML = `<img src="${uData.profilePic || uData.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                        } else {
                            document.getElementById('headerAvatar').innerText = uData.username.charAt(0).toUpperCase();
                        }

                        if (uData.typingTo === activeUser.username) {
                            document.getElementById('headerStatus').innerHTML = `<span style="color: #ea580c; font-weight:600;">typing... ✍️</span>`;
                        } else {
                            const diffSec = (Date.now() - (uData.lastSeen || 0)) / 1000;
                            document.getElementById('headerStatus').innerHTML = diffSec < 60 ? `<span style="color: #16a34a;">● Active</span>` : `<span style="color: #94a3b8;">Offline</span>`;
                        }
                    }
                });
            });
        }
        loadChatUserInfo();

        const messageInput = document.getElementById('messageInput');
        let typingTimeout = null;

        messageInput.addEventListener('input', async () => {
            try {
                const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                if (!myQuery.empty) {
                    await myQuery.docs[0].ref.update({ typingTo: chatWith });
                }
            } catch(e) {}

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(async () => {
                try {
                    const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                    if (!myQuery.empty) {
                        await myQuery.docs[0].ref.update({ typingTo: "" });
                    }
                } catch(e) {}
            }, 2000);
        });

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    selectedImageBase64 = uploadEvent.target.result;
                    messageInput.placeholder = "Photo attached! Tap Send";
                };
                reader.readAsDataURL(file);
            }
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImageBase64) return;

            try {
                const myQuery = await db.collection('users').where("username", "==", activeUser.username).get();
                if (!myQuery.empty) {
                    await myQuery.docs[0].ref.update({ typingTo: "" });
                }
            } catch(e) {}

            const messageData = {
                chatId: chatId,
                sender: activeUser.username,
                receiver: chatWith,
                text: text,
                image: selectedImageBase64 || "",
                read: false,
                createdAt: Date.now()
            };

            try {
                await db.collection('chats').add(messageData);
                messageInput.value = "";
                messageInput.placeholder = "Type a message...";
                selectedImageBase64 = "";
                document.getElementById('imageInput').value = "";
            } catch (err) {
                alert("Failed to send.");
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'none';
        });

        const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

        db.collection('chats').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
            const box = document.getElementById('messagesBox');
            box.innerHTML = "";
            const currentTime = Date.now();

            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const docId = docSnap.id;

                if (msg.chatId === chatId) {
                    if (msg.receiver === activeUser.username && msg.read === false) {
                        db.collection('chats').doc(docId).update({ read: true }).catch(()=>{});
                    }

                    if (currentTime - msg.createdAt > TWENTY_FOUR_HOURS_MS) {
                        db.collection('chats').doc(docId).delete().catch(() => {});
                        return;
                    }

                    const isSent = msg.sender === activeUser.username;
                    const timeString = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

                    if (msg.text) {
                        const textDiv = document.createElement('div');
                        textDiv.innerText = msg.text;
                        msgDiv.appendChild(textDiv);
                    }

                    if (msg.image) {
                        const imgElem = document.createElement('img');
                        imgElem.src = msg.image;
                        imgElem.onclick = (e) => {
                            e.stopImmediatePropagation();
                            document.getElementById('imageModal').style.display = 'flex';
                            document.getElementById('modalImg').src = msg.image;
                            document.getElementById('downloadBtn').href = msg.image;
                        };
                        msgDiv.appendChild(imgElem);
                    }

                    if (isSent) {
                        const unsendHint = document.createElement('span');
                        unsendHint.className = 'unsend-hint';
                        unsendHint.innerText = 'Tap to unsend 🗑️';
                        unsendHint.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm("Kya aap is message ko unsend karna chahte hain?")) {
                                try {
                                    await db.collection('chats').doc(docId).delete();
                                } catch (err) {}
                            }
                        };
                        msgDiv.appendChild(unsendHint);
                    }

                    const footerDiv = document.createElement('div');
                    footerDiv.className = 'msg-footer';

                    const timeDiv = document.createElement('span');
                    timeDiv.className = 'msg-time';
                    timeDiv.innerText = timeString;
                    footerDiv.appendChild(timeDiv);

                    if (isSent) {
                        const readSpan = document.createElement('span');
                        readSpan.className = `read-receipt ${msg.read ? 'read' : 'unread'}`;
                        readSpan.innerText = msg.read ? '✓✓' : '✓';
                        footerDiv.appendChild(readSpan);
                    }

                    msgDiv.appendChild(footerDiv);
                    box.appendChild(msgDiv);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
