<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748692932635414"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Course & Contest | Gen'Z India</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748692932635414" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #07090e;
            --bg-card: #0f172a;
            --accent-gold: #fbbf24;
            --accent-neon: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .course-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .course-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
        }

        .course-meta {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 25px;
            display: flex;
            gap: 20px;
        }

        .course-content {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .course-content h3 {
            color: #fff;
            margin: 20px 0 10px 0;
            font-size: 1.2rem;
        }

        .action-banner {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(99, 102, 241, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .start-quiz-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        /* Quiz Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            position: relative;
        }

        .quiz-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .timer-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #fff;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-neon);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <a href="megacontest.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Hub</a>
        <div class="wallet-badge"><i class="fa-solid fa-wallet"></i> <span id="walletXP">1,250</span> XP</div>
    </header>

    <div class="container">
        <div class="course-box">
            <div class="course-title" id="courseTitle">Loading Module...</div>
            <div class="course-meta">
                <span><i class="fa-solid fa-clock"></i> Estimated Read Time: 45 - 60 Mins</span>
                <span><i class="fa-solid fa-file-lines"></i> 150 Question Pool</span>
            </div>
            
            <div class="course-content" id="courseBody">
                <!-- Comprehensive long text goes here -->
            </div>

            <div class="action-banner">
                <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">Finished reading and revising the module? Take the high-speed challenge now.</p>
                <button class="start-quiz-btn" onclick="openQuizModal()"><i class="fa-solid fa-bolt"></i> Start 5-Sec Rapid Challenge</button>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal-box">
            <div class="quiz-header-bar">
                <span id="questionCounter" style="font-weight: 700; color: var(--text-muted);">Question 1 of 25</span>
                <div class="timer-badge"><i class="fa-solid fa-clock"></i> <span id="timeLeft">5</span>s</div>
            </div>

            <div class="question-text" id="questionTitle">Loading question...</div>
            <div class="options-grid" id="optionsContainer"></div>
        </div>
    </div>

    <script>
        // Simple URL parameter handler to load dynamic text based on category
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat') || 'tech';

        const modulesData = {
            tech: {
                title: "Python Core, Software Architecture & VS Code Mastery",
                body: `<h3>1. Introduction to Python & Dynamic Typing</h3><p>Python is a high-level, interpreted programming language known for its clear syntax and code readability. Unlike statically typed languages like C++ or Java, Python performs type-checking at runtime. Variables do not require explicit declaration to reserve memory space; the declaration happens automatically when a value is assigned.</p><h3>2. Standard Input/Output Handling</h3><p>The built-in <code>input()</code> function reads a line from input, converts it into a string, and returns it. For mathematical computations, explicit type-casting using <code>int()</code> or <code>float()</code> is mandatory. Understanding standard data structures—Lists, Tuples, Sets, and Dictionaries—forms the backbone of software algorithm design.</p><h3>3. Software Development Ecosystems</h3><p>Modern developers utilize advanced IDEs like Visual Studio Code (VS Code), leveraging extensions, integrated terminal version controls (Git), and virtual environments to maintain code isolation and dependency management.</p>`
            },
            env: {
                title: "Ozone Layer Preservation & Disaster Management",
                body: `<h3>1. The Stratospheric Ozone Layer</h3><p>The ozone layer is a region of Earth's stratosphere that absorbs most of the Sun's ultraviolet (UV) radiation. It contains high concentrations of ozone (O3) relative to other parts of the atmosphere. Depletion of this layer is primarily caused by anthropogenic emissions of chlorofluorocarbons (CFCs) and halons.</p><h3>2. Disaster Management Framework</h3><p>Disaster management involves the continuous collection of data, planning, mitigation, response, and recovery strategies to minimize the impact of natural or man-made disasters. Frameworks emphasize community resilience, early warning systems, and sustainable structural planning.</p><h3>3. Advanced Waste Management</h3><p>Modern ecological strategies focus on the circular economy model: Reduce, Reuse, Recycle, Recover, and Refuse to minimize municipal solid waste accumulation in landfills.</p>`
            },
            polity: {
                title: "Indian Polity: President, Home Ministry & Cabinet Operations",
                body: `<h3>1. The President of India: Executive Powers</h3><p>The President of India is the head of state of the Republic of India and the nominal executive. Article 52 states there shall be a President of India. The President is elected indirectly by an electoral college consisting of elected members of both houses of Parliament, and the legislative assemblies of the states. The tenure is 5 years, with powers encompassing legislative assent, ordinance-making (Article 123), and supreme command of the defense forces.</p><h3>2. Ministry of Home Affairs (MHA)</h3><p>The Ministry of Home Affairs is charged with the maintenance of internal security and domestic policy. It oversees paramilitary forces, central intelligence agencies, center-state relations, and union territory administration.</p><h3>3. Ministry of Railways & Cabinet Portfolios</h3><p>The Ministry of Railways manages the nation's rail transport infrastructure. Cabinet ministers formulate broad national policies, piloted through bureaucratic departments and administrative secretariats.</p>`
            }
        };

        // Load content dynamically
        if(modulesData[cat]) {
            document.getElementById('courseTitle').innerText = modulesData[cat].title;
            document.getElementById('courseBody').innerHTML = modulesData[cat].body;
        }

        // Quiz Logic with 5-sec timer and balanced points (+10 correct, -5 wrong)
        const quizQuestions = [
            { q: "What is the primary role of the President of India under Article 52?", options: ["Head of State", "Head of Judiciary", "Prime Minister Advisor", "Chief Election Commissioner"], correct: 0 },
            { q: "Which gas is primarily responsible for stratospheric ozone depletion?", options: ["Carbon Dioxide", "Chlorofluorocarbons (CFCs)", "Methane", "Nitrogen Oxide"], correct: 1 },
            { q: "What type of data does the standard input() function return in Python?", options: ["Integer", "String", "Boolean", "Float"], correct: 1 }
        ];

        let currentQIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 5;

        function openQuizModal() {
            document.getElementById('quizModal').style.display = 'flex';
            currentQIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            if(currentQIndex >= quizQuestions.length) {
                alert("Challenge Complete! Your wallet has been credited with earned XP.");
                document.getElementById('quizModal').style.display = 'none';
                return;
            }

            timeLeft = 5;
            document.getElementById('timeLeft').innerText = timeLeft;
            document.getElementById('questionCounter').innerText = `Question ${currentQIndex + 1} of ${quizQuestions.length}`;

            const q = quizQuestions[currentQIndex];
            document.getElementById('questionTitle').innerText = q.q;

            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx === q.correct);
                optContainer.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timeLeft').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    currentQIndex++;
                    loadQuestion();
                }
            }, 1000);
        }

        function selectAnswer(isCorrect) {
            clearInterval(timerInterval);
            if(isCorrect) {
                score += 10; // Balanced points to support sustainable store cost
            } else {
                score -= 5;
            }
            document.getElementById('walletXP').innerText = 1250 + score;
            currentQIndex++;
            loadQuestion();
        }
    </script>
</body>
</html>
