<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen'Z India ⚡ | Student Ecosystem</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            line-height: 1.6;
        }
        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }
        nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: 0.3s;
            cursor: pointer;
        }
        nav a:hover, nav a.active {
            color: #38bdf8;
        }
        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 15px;
        }
        .hero h1 span {
            color: #38bdf8;
        }
        .hero p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .cta-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .cta-btn:hover {
            background: #0ea5e9;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section-card {
            background: #111827;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #1f2937;
            margin-bottom: 25px;
        }
        .section-card h3 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .form-control {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 12px;
            resize: none;
        }
        .feed-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #334155;
        }
        .feed-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .feed-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #38bdf8;
        }
        .feed-user-info h4 {
            color: #f8fafc;
            font-size: 14px;
        }
        .feed-user-info span {
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Strict Auth Guard: Agar login nahi hai toh login.html par bhej do -->
    <script>
        const user = localStorage.getItem('genzUser');
        if (!user) {
            window.location.href = 'login.html';
        }
    </script>

    <header>
        <a href="index.html" class="logo">Gen'Z India ⚡</a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="voiceup.html">Voice Up Feed</a>
            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </nav>
    </header>

    <div class="hero">
        <h1>Empowering the <span>Voice of Bharat</span></h1>
        <p>A unified platform built by Gen'Z, for Gen'Z. Share ideas, crack academic doubts, and showcase tech innovations.</p>
        <a href="voiceup.html" class="cta-btn">Open Voice Up Feed ✊</a>
    </div>

    <div class="container">
        <!-- DoubtBox Section -->
        <div class="section-card">
            <h3>💬 DoubtBox (Ask Academic Doubts)</h3>
            <form onsubmit="postDoubt(event)">
                <textarea id="doubtText" class="form-control" placeholder="Ask your math, coding, or academic doubt here..." required></textarea>
                <button type="submit" class="cta-btn" style="padding: 8px 20px; font-size: 13px;">Post Doubt</button>
            </form>
            <div id="doubtsFeed" style="margin-top: 20px;">
                <p style="color: #94a3b8; font-size: 13px;">Loading doubts...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.logoutUser = function() {
            localStorage.removeItem('genzUser');
            window.location.href = 'login.html';
        }

        window.postDoubt = async function(event) {
            event.preventDefault();
            const currentUser = JSON.parse(localStorage.getItem('genzUser'));
            const text = document.getElementById('doubtText').value.trim();
            if(!text) return;

            let data = {
                name: currentUser.name,
                username: "@" + currentUser.username,
                photo: currentUser.photo || "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png",
                college: currentUser.college || "Student",
                text: text
            };

            try {
                await addDoc(collection(db, 'doubts'), data);
                alert('Doubt posted successfully!');
                location.reload();
            } catch(e) {
                console.error(e);
                alert('Error posting doubt.');
            }
        }

        async function loadDoubts() {
            const container = document.getElementById('doubtsFeed');
            try {
                const querySnapshot = await getDocs(collection(db, 'doubts'));
                container.innerHTML = '';

                if(querySnapshot.empty) {
                    container.innerHTML = `<p style="color: #94a3b8; font-size: 13px;">No doubts posted yet. Be the first!</p>`;
                    return;
                }

                querySnapshot.forEach((document) => {
                    const d = document.data();
                    let avatar = d.photo || "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png";

                    container.innerHTML += `
                        <div class="feed-card">
                            <div class="feed-header">
                                <img src="${avatar}" class="feed-avatar" alt="Avatar">
                                <div class="feed-user-info">
                                    <h4>${d.name}</h4>
                                    <span>${d.username} • ${d.college}</span>
                                </div>
                            </div>
                            <p style="color: #cbd5e1; font-size: 13.5px; margin-top: 5px;">${d.text}</p>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
                container.innerHTML = `<p style="color: #ef4444; font-size: 13px;">Failed to load doubts.</p>`;
            }
        }

        loadDoubts();
    </script>
</body>
</html>
