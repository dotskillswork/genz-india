<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtFeed | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }
        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }
        .feed-header {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .feed-header h2 {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .feed-header p {
            font-size: 13px;
            color: #94a3b8;
        }
        /* Post Doubt Box */
        .post-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .post-box textarea {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            resize: vertical;
            min-height: 90px;
            margin-bottom: 12px;
        }
        .post-box textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .file-upload-label {
            font-size: 13px;
            color: #38bdf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .post-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .post-btn:hover {
            background: #0ea5e9;
        }
        /* Doubt Card Layout */
        .doubt-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #334155;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #38bdf8;
            font-size: 14px;
        }
        .user-meta h4 {
            font-size: 14px;
            color: #f8fafc;
        }
        .user-meta span {
            font-size: 11px;
            color: #94a3b8;
        }
        .doubt-text {
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .doubt-img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            max-height: 300px;
            object-fit: contain;
            background: #000;
        }
        /* Answers Section */
        .answers-container {
            border-top: 1px solid #1f2937;
            padding-top: 15px;
            margin-top: 15px;
        }
        .answer-item {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .answer-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .answer-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }
        .answer-input-box {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .answer-input-box input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 12px;
        }
        .answer-input-box input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .ans-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <a href="doubtbox.html" class="back-btn">← Back to Subjects</a>
        <h3 style="font-size: 16px; color: #fff;">💬 DoubtFeed Hub</h3>
        <div style="width: 80px;"></div>
    </header>

    <div class="container">
        <!-- Header Info -->
        <div class="feed-header">
            <h2 id="displayCourseSubject">Loading...</h2>
            <p>Ask your doubt or help others by answering community questions</p>
        </div>

        <!-- Post Doubt Box -->
        <div class="post-box">
            <form id="doubtForm">
                <textarea id="doubtText" placeholder="Type your doubt or question here..." required></textarea>
                <div class="post-actions">
                    <label class="file-upload-label">
                        📷 Attach Image (Optional)
                        <input type="file" id="doubtImage" accept="image/*" style="display: none;">
                    </label>
                    <button type="submit" class="post-btn" id="postBtn">Post Doubt</button>
                </div>
                <p id="imageFileName" style="font-size: 11px; color: #38bdf8; margin-top: 8px;"></p>
            </form>
        </div>

        <!-- Doubts Live Feed Container -->
        <div id="doubtsFeedContainer">
            <p style="color: #64748b; text-align: center; font-size: 13px;">Loading doubts...</p>
        </div>
    </div>

    <!-- Firebase & Doubt Feed Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, arrayUnion, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const activeUser = JSON.parse(localStorage.getItem('genzUser'));
        if (!activeUser) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const course = urlParams.get('course') || 'General';
        const subject = urlParams.get('subject') || 'General Discussion';

        document.getElementById('displayCourseSubject').innerText = `${course} › ${subject}`;

        // Image file name display
        document.getElementById('doubtImage').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : '';
            document.getElementById('imageFileName').innerText = fileName ? `Attached: ${fileName}` : '';
        });

        // Helper to convert image to Base64 so it stores cleanly in Firestore without external storage setup complexity
        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Post Doubt Handler
        document.getElementById('doubtForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = document.getElementById('doubtText').value.trim();
            const imageFile = document.getElementById('doubtImage').files[0];
            const postBtn = document.getElementById('postBtn');

            if (!text) return;

            postBtn.innerText = "Posting...";
            postBtn.disabled = true;

            let imageUrl = "";
            if (imageFile) {
                try {
                    imageUrl = await convertImageToBase64(imageFile);
                } catch (err) {
                    console.error("Image conversion error:", err);
                }
            }

            const newDoubt = {
                course: course,
                subject: subject,
                author: activeUser.username,
                authorPic: activeUser.profilePic || "",
                text: text,
                imageUrl: imageUrl,
                createdAt: Date.now(),
                answers: []
            };

            try {
                await addDoc(collection(db, 'doubts'), newDoubt);
                document.getElementById('doubtText').value = '';
                document.getElementById('doubtImage').value = '';
                document.getElementById('imageFileName').innerText = '';
            } catch (err) {
                console.error("Error posting doubt:", err);
                alert("Failed to post doubt.");
            } finally {
                postBtn.innerText = "Post Doubt";
                postBtn.disabled = false;
            }
        });

        // Real-time Doubt Feed Listener
        const q = query(collection(db, 'doubts'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('doubtsFeedContainer');
            container.innerHTML = "";

            let doubtsList = [];
            snapshot.forEach((docSnap) => {
                const d = docSnap.data();
                if (d.course === course && d.subject === subject) {
                    doubtsList.push({ id: docSnap.id, ...d });
                }
            });

            if (doubtsList.length === 0) {
                container.innerHTML = `<p style="color: #64748b; text-align: center; font-size: 13px; padding: 20px;">No doubts asked in this subject yet. Be the first one to ask! 🚀</p>`;
                return;
            }

            doubtsList.forEach((doubt) => {
                const timeString = new Date(doubt.createdAt).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
                const authorInitial = doubt.author ? doubt.author.charAt(0).toUpperCase() : 'U';
                
                let answersHtml = '';
                if (doubt.answers && doubt.answers.length > 0) {
                    doubt.answers.forEach((ans) => {
                        const ansInit = ans.author ? ans.author.charAt(0).toUpperCase() : 'U';
                        const ansAvatar = ans.authorPic ? `<img src="${ans.authorPic}" class="answer-avatar">` : `<div class="answer-avatar" style="display:flex;align-items:center;justify-content:center;background:#334155;color:#38bdf8;font-size:10px;font-weight:600;">${ansInit}</div>`;
                        answersHtml += `
                            <div class="answer-item">
                                <div class="answer-header">
                                    ${ansAvatar}
                                    <strong style="color: #38bdf8; font-size: 12px;">@${ans.author}</strong>
                                </div>
                                <p style="color: #cbd5e1; margin-top: 2px;">${ans.text}</p>
                            </div>
                        `;
                    });
                } else {
                    answersHtml = `<p style="color: #64748b; font-size: 12px; font-style: italic;">No answers yet. Be the first to reply!</p>`;
                }

                const authorAvatar = doubt.authorPic ? `<img src="${doubt.authorPic}" class="user-avatar">` : `<div class="user-avatar">${authorInitial}</div>`;

                container.innerHTML += `
                    <div class="doubt-card">
                        <div class="user-info">
                            ${authorAvatar}
                            <div class="user-meta">
                                <h4>@${doubt.author}</h4>
                                <span>${timeString}</span>
                            </div>
                        </div>
                        <div class="doubt-text">${doubt.text}</div>
                        ${doubt.imageUrl ? `<img src="${doubt.imageUrl}" class="doubt-img">` : ``}
                        
                        <div class="answers-container">
                            <h5 style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Answers & Replies:</h5>
                            <div id="answersList_${doubt.id}">
                                ${answersHtml}
                            </div>
                            <form class="answer-input-box" onsubmit="postAnswer(event, '${doubt.id}')">
                                <input type="text" id="ansInput_${doubt.id}" placeholder="Write a helpful answer..." autocomplete="off" required>
                                <button type="submit" class="ans-btn">Reply</button>
                            </form>
                        </div>
                    </div>
                `;
            });
        });

        // Global function for answering a doubt
        window.postAnswer = async function(event, doubtId) {
            event.preventDefault();
            const inputField = document.getElementById(`ansInput_${doubtId}`);
            const text = inputField.value.trim();
            if (!text) return;

            const newAnswer = {
                author: activeUser.username,
                authorPic: activeUser.profilePic || "",
                text: text,
                createdAt: Date.now()
            };

            try {
                const doubtRef = doc(db, 'doubts', doubtId);
                await updateDoc(doubtRef, {
                    answers: arrayUnion(newAnswer)
                });
                inputField.value = '';
            } catch (err) {
                console.error("Error posting answer:", err);
                alert("Failed to send answer.");
            }
        };
    </script>
</body>
</html>
