<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #111827;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1f2937;
            width: 100%;
            max-width: 400px;
        }
        .auth-card h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .auth-card input {
            width: 100%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }
        .submit-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #0ea5e9;
        }
        .auth-link {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }
        .auth-link a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back ⚡</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="lEmail" placeholder="name@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="lPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
            <div class="auth-link">
                Don't have an account? <a href="signup.html">Sign Up here</a>
            </div>
        </form>
    </div>

    <!-- Firebase Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRSDRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function(event) {
            event.preventDefault();
            let email = document.getElementById('lEmail').value.trim();
            let password = document.getElementById('lPass').value.trim();

            try {
                const q = query(collection(db, "users"), where("email", "==", email), where("password", "==", password));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert('Invalid Email or Password! Please check your credentials.');
                    return;
                }

                // Get User Data and save to localStorage
                let userData = {};
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                localStorage.setItem('genzUser', JSON.stringify(userData)); // User data save kiya
                localStorage.removeItem('hasSeenWelcome'); // Flag hata diya taaki welcome page chale
                window.location.href = 'welcome.html'; // Welcome page par bhej diya
            } catch(e) {
                console.error(e);
                alert('Login failed. Please try again.');
            }
        }
    </script>
</body>
</html>
