<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Search Console optimization: Prevent indexing login/auth pages -->
    <meta name="robots" content="noindex, nofollow">
    <title>Login | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .auth-card h2 {
            color: #0284c7;
            margin-bottom: 24px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .auth-card input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }
        .google-btn {
            background: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .google-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            color: #94a3b8;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12.5px;
            color: #64748b;
        }
        .auth-link a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            color: #0369a1;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        /* Grand Success Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .success-modal {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .success-modal {
            transform: scale(1);
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
        }
        .success-modal h3 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .success-modal p {
            color: #64748b;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back ⚡</h2>
        <div id="errorAlert" class="error-msg"></div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="lEmail" placeholder="name@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="lPass" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        </form>

        <div class="divider">or continue with</div>

        <button type="button" class="google-btn" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.98 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Sign in with Google
        </button>

        <div class="auth-link">
            Don't have an account? <a href="signup.html">Sign Up here</a>
        </div>
    </div>

    <!-- Grand Success Modal Popup -->
    <div id="successModal" class="modal-overlay">
        <div class="success-modal">
            <div class="success-icon">✓</div>
            <h3>Welcome Back!</h3>
            <p>Login successful. Redirecting you to your dashboard...</p>
            <button class="modal-btn" onclick="redirectToWelcome()">Continue Now</button>
        </div>
    </div>

    <!-- Firebase Secure Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showSuccessModal = function() {
            document.getElementById('successModal').classList.add('active');
            setTimeout(() => {
                redirectToWelcome();
            }, 1800);
        }

        window.redirectToWelcome = function() {
            window.location.href = 'welcome.html';
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            let email = document.getElementById('lEmail').value.trim().toLowerCase();
            let password = document.getElementById('lPass').value.trim();
            let btn = document.getElementById('loginBtn');
            let errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';
            btn.innerText = "Logging in...";
            btn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                let userData = docSnap.exists() ? docSnap.data() : { email: user.email };

                localStorage.setItem('genzUser', JSON.stringify(userData));
                localStorage.removeItem('hasSeenWelcome');
                
                showSuccessModal();
            } catch(e) {
                console.error("Login Error Code:", e.code);
                console.error("Login Error Message:", e.message);
                
                let userFriendlyMessage = 'Invalid Email or Password! Please check your credentials.';
                if (e.code === 'auth/user-not-found') {
                    userFriendlyMessage = 'No account found with this email. Please Sign Up first.';
                } else if (e.code === 'auth/wrong-password') {
                    userFriendlyMessage = 'Incorrect password entered.';
                } else if (e.code === 'auth/invalid-credential') {
                    userFriendlyMessage = 'Invalid email or password combination.';
                }

                errorAlert.innerText = userFriendlyMessage;
                errorAlert.style.display = 'block';

                btn.innerText = "Login";
                btn.disabled = false;
            }
        }

        window.handleGoogleLogin = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                let userData;
                if (!docSnap.exists()) {
                    userData = {
                        uid: user.uid,
                        name: user.displayName || 'Student',
                        username: user.email.split('@')[0],
                        email: user.email,
                        profilePic: user.photoURL || '',
                        createdAt: Date.now()
                    };
                    await setDoc(docRef, userData);
                } else {
                    userData = docSnap.data();
                }

                localStorage.setItem('genzUser', JSON.stringify(userData));
                localStorage.removeItem('hasSeenWelcome');
                
                showSuccessModal();
            } catch (e) {
                console.error("Google Signin Error:", e);
                const errorAlert = document.getElementById('errorAlert');
                errorAlert.innerText = "Google Sign-in failed. Please try again.";
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
