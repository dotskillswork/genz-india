<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .auth-card h2 {
            color: #0284c7;
            margin-bottom: 24px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .auth-card input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12.5px;
            color: #64748b;
        }
        .auth-link a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back ⚡</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="lEmail" placeholder="name@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="lPass" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">Login</button>
            <div class="auth-link">
                Don't have an account? <a href="signup.html">Sign Up here</a>
            </div>
        </form>
    </div>

    <!-- Firebase Secure Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleLogin = async function(event) {
            event.preventDefault();
            let email = document.getElementById('lEmail').value.trim().toLowerCase();
            let password = document.getElementById('lPass').value.trim();
            let btn = document.getElementById('loginBtn');

            btn.innerText = "Logging in...";
            btn.disabled = true;

            try {
                // Firebase Standard Secure Authentication (Yeh phishing warning ko jad se hatayega)
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Firestore se additional user data fetch karna agar zaroorat ho
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                let userData = docSnap.exists() ? docSnap.data() : { email: user.email };

                localStorage.setItem('genzUser', JSON.stringify(userData));
                localStorage.removeItem('hasSeenWelcome');
                window.location.href = 'welcome.html';
            } catch(e) {
                console.error(e);
                alert('Invalid Email or Password! Please check your credentials.');
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
