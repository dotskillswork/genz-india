<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748692932635414"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Login | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }
        .auth-card h2 {
            color: #0284c7;
            margin-bottom: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }
        .auth-subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-note {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            display: block;
            font-style: italic;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .auth-card input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
            background: #ffffff;
        }
        .forgot-pass-container {
            text-align: right;
            margin-bottom: 20px;
            margin-top: -6px;
        }
        .forgot-pass-container a {
            font-size: 12px;
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-pass-container a:hover {
            text-decoration: underline;
        }
        .submit-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12.5px;
            color: #64748b;
        }
        .auth-link a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
        .success-msg {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        /* Success Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .success-modal {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .success-modal {
            transform: scale(1);
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
        }
        .success-modal h3 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .success-modal p {
            color: #64748b;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back ⚡</h2>
        <p class="auth-subtitle">Sign in to your Gen'Z India account</p>
        
        <div id="errorAlert" class="error-msg"></div>
        <div id="successAlert" class="success-msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="lIdentifier" placeholder="Enter your username or email" autocomplete="username" required>
                <small class="form-note">Note: If entering an email, make sure to include '@' at the start/middle.</small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="lPass" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <div class="forgot-pass-container">
                <a href="#" onclick="handleForgotPassword(event)">Forgot Password?</a>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="signup.html">Sign Up here</a>
        </div>
    </div>

    <!-- Success Modal Popup -->
    <div id="successModal" class="modal-overlay">
        <div class="success-modal">
            <div class="success-icon">✓</div>
            <h3>Welcome Back!</h3>
            <p>Login successful. Redirecting you to your dashboard...</p>
            <button class="modal-btn" onclick="redirectToWelcome()">Continue Now</button>
        </div>
    </div>

    <!-- Firebase Secure Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNLwSjHq6LlX9uUovTRHrz9ZfUwEIUWQM",
            authDomain: "genz-india.firebaseapp.com",
            projectId: "genz-india",
            storageBucket: "genz-india.firebasestorage.app",
            messagingSenderId: "149959470783",
            appId: "1:149959470783:web:71b7969ee2c8fc049c200a",
            measurementId: "G-RBRDSRKSRH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showSuccessModal = function() {
            document.getElementById('successModal').classList.add('active');
            setTimeout(() => {
                redirectToWelcome();
            }, 1800);
        }

        window.redirectToWelcome = function() {
            window.location.href = 'welcome.html';
        }

        // Login with Username or Email & Password
        window.handleLogin = async function(event) {
            event.preventDefault();
            let identifier = document.getElementById('lIdentifier').value.trim();
            let password = document.getElementById('lPass').value.trim();
            let btn = document.getElementById('loginBtn');
            let errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';
            btn.innerText = "Logging in...";
            btn.disabled = true;

            try {
                let userEmail = "";
                let userData = {};

                // Check if user entered an Email or a Username
                if (identifier.includes('@')) {
                    userEmail = identifier.toLowerCase();
                    const qEmail = query(collection(db, "users"), where("email", "==", userEmail));
                    const querySnapshot = await getDocs(qEmail);

                    if (querySnapshot.empty) {
                        throw new Error("Email not found! Please check your email.");
                    }

                    querySnapshot.forEach((docSnap) => {
                        userData = docSnap.data();
                    });
                } else {
                    let username = identifier.toLowerCase();
                    const qUser = query(collection(db, "users"), where("username", "==", username));
                    const querySnapshot = await getDocs(qUser);

                    if (querySnapshot.empty) {
                        throw new Error("Username not found! Please check your username.");
                    }

                    querySnapshot.forEach((docSnap) => {
                        userData = docSnap.data();
                        userEmail = userData.email;
                    });
                }

                // Firebase Auth se email aur password ke zariye login karna
                const userCredential = await signInWithEmailAndPassword(auth, userEmail, password);
                
                localStorage.setItem('genzUser', JSON.stringify(userData));
                localStorage.removeItem('hasSeenWelcome');
                
                showSuccessModal();
            } catch(e) {
                console.error("Login Error:", e);
                let userFriendlyMessage = 'Invalid Username/Email or Password! Please try again.';
                if (e.message.includes("Username not found")) {
                    userFriendlyMessage = 'This username does not exist. Please check or Sign Up.';
                } else if (e.message.includes("Email not found")) {
                    userFriendlyMessage = 'This email does not exist. Please check or Sign Up.';
                } else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
                    userFriendlyMessage = 'Incorrect password entered.';
                }

                errorAlert.innerText = userFriendlyMessage;
                errorAlert.style.display = 'block';

                btn.innerText = "Login";
                btn.disabled = false;
            }
        }

        // Forgot Password Logic (Via Email or Username)
        window.handleForgotPassword = async function(event) {
            event.preventDefault();
            let identifier = document.getElementById('lIdentifier').value.trim();
            let errorAlert = document.getElementById('errorAlert');
            let successAlert = document.getElementById('successAlert');

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            if (!identifier) {
                errorAlert.innerText = 'Please enter your Username or Email first, then click Forgot Password.';
                errorAlert.style.display = 'block';
                return;
            }

            try {
                let userEmail = "";

                if (identifier.includes('@')) {
                    userEmail = identifier.toLowerCase();
                } else {
                    let username = identifier.toLowerCase();
                    const qUser = query(collection(db, "users"), where("username", "==", username));
                    const querySnapshot = await getDocs(qUser);

                    if (querySnapshot.empty) {
                        throw new Error("User not found.");
                    }

                    querySnapshot.forEach((docSnap) => {
                        userEmail = docSnap.data().email;
                    });
                }

                await sendPasswordResetEmail(auth, userEmail);
                successAlert.innerText = 'Password reset link has been sent to (' + userEmail + ')!';
                successAlert.style.display = 'block';
            } catch (e) {
                console.error("Reset Error:", e);
                errorAlert.innerText = 'Could not find an account associated with this username or email.';
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
