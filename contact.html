<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .back-btn {
            color: #0284c7;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #0369a1;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }
        .contact-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .contact-card h1 {
            color: #0284c7;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .contact-card p {
            color: #64748b;
            font-size: 13.5px;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .contact-card input, .contact-card textarea {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 14px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .contact-card input:focus, .contact-card textarea:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        <h3 style="font-size: 16px; color: #0f172a; font-weight: 700;">📞 Contact Us</h3>
        <div style="width: 80px;"></div>
    </header>

    <div class="container">
        <div class="contact-card">
            <h1>Get in Touch 💬</h1>
            <p>Have a question, feedback, or need support? Drop us a message below!</p>
            
            <form onsubmit="handleContactSubmit(event)">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="cName" placeholder="Rahul Sharma" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="cEmail" placeholder="name@email.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="cMsg" rows="4" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message 🚀</button>
            </form>
        </div>
    </div>

    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            alert("Thank you! Your message has been sent successfully. We will get back to you soon. 😊");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
