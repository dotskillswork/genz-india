<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Gen'Z India</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // YAHAN APNI EMAILJS PUBLIC KEY DAAL DE BHAI 👇
            emailjs.init("APNI_PUBLIC_KEY_YAHAN_DAAL"); 
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .back-btn {
            color: #0284c7;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #0369a1;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }
        .contact-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .contact-card h1 {
            color: #0284c7;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .contact-card p {
            color: #64748b;
            font-size: 13.5px;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .contact-card input, .contact-card textarea {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 14px;
            color: #1e293b;
            font-size: 13.5px;
            transition: 0.3s;
        }
        .contact-card input:focus, .contact-card textarea:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: #ffffff;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .submit-btn:hover {
            background: #0369a1;
        }

        /* 🚀 Chandrayaan-3 Style Rocket Animation CSS */
        .rocket-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.4;
            animation: moveStars 20s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        .rocket-container {
            position: relative;
            z-index: 10;
            animation: flyUp 2.5s cubic-bezier(0.5, 0, 0.2, 1) forwards;
        }

        .rocket {
            font-size: 100px;
            transform: rotate(-45deg);
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.6));
        }

        .flag {
            position: absolute;
            top: 40px;
            left: 20px;
            font-size: 30px;
            animation: wave 0.5s infinite alternate;
        }

        .fire {
            font-size: 60px;
            position: absolute;
            bottom: -30px;
            left: 10px;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { transform: translateY(20vh) scale(1); opacity: 1; }
            80% { transform: translateY(-20vh) scale(1); opacity: 1; }
            100% { transform: translateY(-150vh) scale(0.5); opacity: 0; }
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes wave {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }

        .jai-hind-text {
            font-size: 50px;
            font-weight: 800;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            /* Tiranga Gradient */
            background: linear-gradient(to bottom, #FF9933 33%, #FFFFFF 33%, #FFFFFF 66%, #138808 66%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            animation: fadeInOutText 2.5s ease-in-out forwards;
        }

        .sub-text {
            color: #e2e8f0;
            font-size: 16px;
            margin-top: 10px;
            font-weight: 500;
            z-index: 10;
            animation: fadeInOutText 2.5s ease-in-out forwards;
        }

        @keyframes fadeInOutText {
            0% { opacity: 0; transform: translateY(20px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- Rocket Launch Animation Overlay -->
    <div id="rocketOverlay" class="rocket-overlay">
        <div class="stars"></div>
        <div class="rocket-container">
            <div class="rocket">🚀</div>
            <div class="flag">🇮🇳</div>
            <div class="fire">🔥</div>
        </div>
        <div class="jai-hind-text">Jai Hind!</div>
        <div class="sub-text">Chandrayaan-3 Mission Style: Message Taking Off... 🌌</div>
    </div>

    <header>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        <h3 style="font-size: 16px; color: #0f172a; font-weight: 700;">📞 Contact Us</h3>
        <div style="width: 80px;"></div>
    </header>

    <div class="container">
        <div class="contact-card">
            <h1>Get in Touch 💬</h1>
            <p>Have a question, feedback, or need support? Drop us a message below!</p>
            
            <form id="contactForm" onsubmit="sendEmailWithAnimation(event)">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="cName" placeholder="Rahul Sharma" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="cEmail" placeholder="name@email.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="cMsg" rows="4" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="sendBtn">Send Message 🚀</button>
            </form>
        </div>
    </div>

    <script>
        function sendEmailWithAnimation(e) {
            e.preventDefault(); // Form reload hone se rokega
            
            const btn = document.getElementById('sendBtn');
            const overlay = document.getElementById('rocketOverlay');

            btn.innerText = "Launching... ⏳";
            btn.disabled = true;

            // 🚀 Animation Start
            overlay.style.display = 'flex';

            const templateParams = {
                from_name: document.getElementById('cName').value.trim(),
                from_email: document.getElementById('cEmail').value.trim(),
                message: document.getElementById('cMsg').value.trim()
            };

            // EmailJS API Call (Tere Service ID aur Template ID ke sath)
            emailjs.send("service_bb6u3ua", "template_zpla94k", templateParams)
                .then(function(response) {
                    // Animation ko poora hone ka time do (2.5 seconds)
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        alert("Mission Successful! 🇮🇳 JAI HIND! Your message landed safely in our inbox.");
                        document.getElementById('contactForm').reset();
                        window.location.href = 'index.html';
                    }, 2500);
                }, function(error) {
                    overlay.style.display = 'none';
                    console.error("FAILED...", error);
                    alert("Mission Failed! Please check your internet and try again.");
                    btn.innerText = "Send Message 🚀";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
